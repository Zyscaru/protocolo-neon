const BANCA_PY = "\"\"\"Protocolo Neon — banca de testes (roda no Pyodide e no CPython).\n\nA interface aceita o código do aluno, executa com limite de tempo e devolve um JSON\ncom o resultado e o rastro de eventos do drone para a animação.\n\"\"\"\nimport sys, time, io, json, re, random, itertools, functools, dataclasses, traceback, inspect\nfrom collections import deque, Counter\nfrom contextlib import redirect_stdout\nimport heapq\n\nPASSO = {\"N\": (-1, 0), \"S\": (1, 0), \"L\": (0, 1), \"O\": (0, -1)}\nGIRO_D = {\"N\": \"L\", \"L\": \"S\", \"S\": \"O\", \"O\": \"N\"}\nGIRO_E = {v: k for k, v in GIRO_D.items()}\n\n\nclass Falha(Exception):\n    \"\"\"O drone falhou no mapa (bateu, laser...).\"\"\"\n\n\nclass Reprova(Exception):\n    def __init__(self, msg, destaque=None):\n        super().__init__(msg)\n        self.msg = msg\n        self.destaque = destaque\n\n\nclass Estouro(BaseException):\n    \"\"\"Tempo esgotado (BaseException para não ser engolida por except Exception).\"\"\"\n\n\ndef exigir(cond, msg, destaque=None):\n    if not cond:\n        raise Reprova(msg, destaque)\n\n\ndef curto(x, n=200):\n    s = x if isinstance(x, str) else repr(x)\n    return s if len(s) <= n else s[:n] + \" …\"\n\n\ndef pegar(ns, nome, tipo=\"funcao\"):\n    if nome not in ns:\n        oque = {\"funcao\": \"a função\", \"classe\": \"a classe\", \"valor\": \"o nome\"}[tipo]\n        raise Reprova(f\"Não encontrei {oque} {nome}. O nome precisa ser exatamente esse (maiúsculas contam).\")\n    obj = ns[nome]\n    if tipo == \"classe\":\n        exigir(isinstance(obj, type), f\"{nome} precisa ser uma classe (class {nome}: ...).\")\n    elif tipo == \"funcao\":\n        exigir(callable(obj), f\"{nome} precisa ser uma função.\")\n    return obj\n\n\n# ---------------------------------------------------------------- mapa e drone\ndef achar(mapa, ch):\n    for l, linha in enumerate(mapa):\n        c = linha.find(ch)\n        if c >= 0:\n            return (l, c)\n    return None\n\n\nclass Sim:\n    def __init__(self, mapa, inicio=None, direcao=\"L\", lasers=False, custos=False):\n        self.g = [list(r) for r in mapa]\n        ini = inicio or achar(mapa, \"S\")\n        if ini and self.g[ini[0]][ini[1]] == \"S\":\n            self.g[ini[0]][ini[1]] = \".\"\n        self.l, self.c = ini\n        self.dir = direcao\n        self.t = 0\n        self.lasers = lasers\n        self.custos = custos\n        self.custo = 0\n        self.chips = {(l, c) for l, r in enumerate(self.g) for c, x in enumerate(r) if x == \"$\"}\n        self.total = len(self.chips)\n        self.trace = []\n\n    def casa(self, l, c):\n        if 0 <= l < len(self.g) and 0 <= c < len(self.g[0]):\n            return self.g[l][c]\n        return \"#\"\n\n    def mover(self, d):\n        if d not in PASSO:\n            raise Falha(f\"{d!r} não é um movimento válido. Use \\\"N\\\", \\\"S\\\", \\\"L\\\" ou \\\"O\\\".\")\n        dl, dc = PASSO[d]\n        nl, nc = self.l + dl, self.c + dc\n        self.dir = d\n        if self.casa(nl, nc) == \"#\":\n            self.trace.append({\"e\": \"crash\", \"l\": nl, \"c\": nc, \"d\": d})\n            raise Falha(\"O drone bateu num prédio!\")\n        self.l, self.c = nl, nc\n        self.t += 1\n        casa = self.casa(nl, nc)\n        self.custo += int(casa) if (self.custos and casa.isdigit()) else 1\n        self.trace.append({\"e\": \"move\", \"l\": nl, \"c\": nc, \"d\": d, \"t\": self.t})\n        self._depois()\n\n    def esperar(self):\n        self.t += 1\n        self.trace.append({\"e\": \"wait\", \"t\": self.t})\n        self._depois()\n\n    def avancar(self):\n        self.mover(self.dir)\n\n    def girar(self, lado):\n        if lado not in (\"D\", \"E\"):\n            raise Falha(f\"girar precisa de \\\"D\\\" ou \\\"E\\\", não {lado!r}.\")\n        self.dir = (GIRO_D if lado == \"D\" else GIRO_E)[self.dir]\n        self.trace.append({\"e\": \"turn\", \"d\": self.dir})\n\n    def acao(self, a):\n        if a == \"P\":\n            self.esperar()\n        else:\n            self.mover(a)\n\n    def _depois(self):\n        p = (self.l, self.c)\n        if p in self.chips:\n            self.chips.discard(p)\n            self.trace.append({\"e\": \"pick\", \"l\": self.l, \"c\": self.c})\n        casa = self.casa(*p)\n        if self.lasers and casa in \"012\" and self.t % 3 == int(casa):\n            self.trace.append({\"e\": \"zap\", \"l\": self.l, \"c\": self.c})\n            raise Falha(f\"Um laser atingiu o drone no instante {self.t}.\")\n\n    def chegou(self):\n        return self.casa(self.l, self.c) == \"@\"\n\n\ndef executar_rota(sim, rota, exigir_fim=True, exigir_chips=True):\n    exigir(isinstance(rota, (list, tuple)), f\"A rota precisa ser uma lista de movimentos, mas veio {curto(rota)}.\")\n    for a in rota:\n        exigir(isinstance(a, str), f\"Cada movimento precisa ser um texto como \\\"L\\\", mas encontrei {a!r}.\")\n        sim.acao(a)\n    if exigir_fim:\n        exigir(sim.chegou(), \"A rota terminou, mas o drone não chegou ao destino.\")\n    if exigir_chips:\n        exigir(not sim.chips, f\"Ficaram {len(sim.chips)} chip(s) para trás.\")\n\n\ndef rota_mapa(movs, marcas=None):\n    marcas = marcas or {}\n    l = c = 0\n    cells = [(0, 0)]\n    for m in movs:\n        dl, dc = PASSO[m]\n        l, c = l + dl, c + dc\n        cells.append((l, c))\n    ml = min(x[0] for x in cells); mc = min(x[1] for x in cells)\n    H = max(x[0] for x in cells) - ml + 3; W = max(x[1] for x in cells) - mc + 3\n    g = [[\"#\"] * W for _ in range(H)]\n    for i, (a, b) in enumerate(cells):\n        g[a - ml + 1][b - mc + 1] = \"@\" if i == len(cells) - 1 else marcas.get(i, \".\")\n    g[1 - ml][1 - mc] = \"S\" if len(cells) > 1 else \"@\"\n    return [\"\".join(r) for r in g]\n\n\ndef bfs(mapa, inicio, alvo):\n    dist = {inicio: 0}\n    fila = deque([inicio])\n    while fila:\n        l, c = fila.popleft()\n        if (l, c) == alvo:\n            return dist[(l, c)]\n        for dl, dc in PASSO.values():\n            p = (l + dl, c + dc)\n            if 0 <= p[0] < len(mapa) and 0 <= p[1] < len(mapa[0]) and mapa[p[0]][p[1]] != \"#\" and p not in dist:\n                dist[p] = dist[(l, c)] + 1\n                fila.append(p)\n    return -1\n\n\n# ---------------------------------------------------------------- missões\nMISSOES = {}\n\n\ndef missao(cls):\n    m = cls()\n    MISSOES[m.id] = m\n    return cls\n\n\nclass Missao:\n    id = \"\"\n    extras = \"\"          # código da estação executado antes do aluno\n    casos = []\n\n    def sim(self, caso):\n        if \"mapa\" not in caso:\n            return None\n        return Sim(caso[\"mapa\"], tuple(caso[\"inicio\"]) if caso.get(\"inicio\") else None,\n                   caso.get(\"direcao\", \"L\"), caso.get(\"lasers\", False), caso.get(\"custos\", False))\n\n    def verificar(self, ns, caso, sim):\n        raise NotImplementedError\n\n\n# ===== Distrito 1: funções de primeira classe =====\n@missao\nclass Limitador(Missao):\n    id = \"n1\"\n    seqs = [\n        (3, 5, [(\"a\", 0), (\"a\", 1), (\"a\", 1), (\"a\", 2), (\"a\", 4), (\"a\", 5), (\"a\", 6), (\"a\", 7), (\"a\", 9), (\"a\", 12)]),\n        (2, 3, [(\"a\", 0), (\"b\", 0), (\"a\", 1), (\"b\", 1), (\"a\", 2), (\"b\", 2), (\"a\", 3), (\"b\", 3), (\"a\", 4), (\"a\", 4), (\"b\", 6), (\"a\", 9)]),\n        (1, 1, [(\"a\", 5), (\"a\", 5), (\"a\", 6), (\"a\", 6), (\"a\", 6), (\"a\", 10)]),\n    ]\n    casos = [{\"maximo\": m, \"janela\": j, \"seq\": s,\n              \"mostra\": [f\"tentar, bloqueadas = criar_limitador({m}, {j})\" + (\"   # e um segundo limitador b\" if any(x == \"b\" for x, _ in s) else \"\"),\n                         \"tentativas: \" + \" \".join(f\"{x}@{t}\" for x, t in s)]} for m, j, s in seqs]\n\n    @staticmethod\n    def referencia(maximo, janela):\n        aceitas = deque(); bloq = [0]\n        def tentar(t):\n            while aceitas and aceitas[0] <= t - janela:\n                aceitas.popleft()\n            if len(aceitas) < maximo:\n                aceitas.append(t); return True\n            bloq[0] += 1; return False\n        return tentar, lambda: bloq[0]\n\n    def verificar(self, ns, caso, sim):\n        criar = pegar(ns, \"criar_limitador\")\n        lims, refs = {}, {}\n        for nome in \"ab\":\n            r = criar(caso[\"maximo\"], caso[\"janela\"])\n            exigir(isinstance(r, tuple) and len(r) == 2 and all(callable(f) for f in r),\n                   f\"criar_limitador precisa devolver a tupla (tentar, bloqueadas) com duas funções, mas devolveu {curto(r)}.\")\n            exigir(r[0].__closure__, \"tentar precisa ser uma closure: uma função definida dentro de criar_limitador que usa as variáveis dela.\")\n            lims[nome] = r\n            refs[nome] = self.referencia(caso[\"maximo\"], caso[\"janela\"])\n        linhas = []\n        for nome, t in caso[\"seq\"]:\n            v = lims[nome][0](t)\n            e = refs[nome][0](t)\n            exigir(v == e, f\"Limitador {nome}, tentativa no instante {t}: tentar({t}) devolveu {v!r}, mas o certo é {e!r}.\")\n            linhas.append(f\"{nome}@{t}  {'✓ aceita' if e else '✗ bloqueada'}\")\n            vb, eb = lims[nome][1](), refs[nome][1]()\n            exigir(vb == eb, f\"Limitador {nome}, depois do instante {t}: bloqueadas() devolveu {vb!r}, mas o certo é {eb}.\")\n        return {\"ok\": True, \"painel\": linhas, \"nota\": f\"bloqueadas: a={refs['a'][1]()}, b={refs['b'][1]()}\"}\n\n\n@missao\nclass Registrar(Missao):\n    id = \"n2\"\n    casos = [{\"mostra\": [\"@registrar\", \"def invadir(alvo, nivel=1): ...\", \"invadir(\\\"srv-07\\\", nivel=3)\", \"invadir(\\\"cam-12\\\")\"]},\n             {\"mostra\": [\"@registrar\", \"def decifrar(chave): ...   # falha com ValueError\", \"decifrar(\\\"0xFF\\\")\", \"decifrar(\\\"zz\\\")\"]}]\n\n    def verificar(self, ns, caso, sim):\n        registrar = pegar(ns, \"registrar\")\n        reg = pegar(ns, \"REGISTRO\", \"valor\")\n        exigir(isinstance(reg, list), \"REGISTRO precisa ser uma lista, criada no topo do código: REGISTRO = []\")\n        reg.clear()\n        painel = []\n        if caso[\"mostra\"][1].startswith(\"def invadir\"):\n            def invadir(alvo, nivel=1):\n                \"Invade um alvo da rede.\"\n                return f\"{alvo}:acesso-{nivel}\"\n            f = registrar(invadir)\n            exigir(callable(f), \"registrar precisa devolver uma função (o envelope).\")\n            exigir(f.__name__ == \"invadir\", f\"A função decorada perdeu o nome: __name__ virou {f.__name__!r}. Use @functools.wraps(func) no envelope.\")\n            exigir(f.__doc__ == \"Invade um alvo da rede.\", \"A função decorada perdeu a documentação (__doc__). Use @functools.wraps(func).\")\n            r1 = f(\"srv-07\", nivel=3)\n            exigir(r1 == \"srv-07:acesso-3\", f\"invadir(\\\"srv-07\\\", nivel=3) deveria devolver 'srv-07:acesso-3', mas devolveu {curto(r1)}. O envelope precisa devolver o resultado.\")\n            r2 = f(\"cam-12\")\n            esperado = [(\"invadir\", (\"srv-07\",), {\"nivel\": 3}, \"srv-07:acesso-3\"), (\"invadir\", (\"cam-12\",), {}, \"cam-12:acesso-1\")]\n        else:\n            def decifrar(chave):\n                \"Converte uma chave hexadecimal.\"\n                return int(chave, 16)\n            f = registrar(decifrar)\n            exigir(f.__name__ == \"decifrar\", f\"A função decorada perdeu o nome: __name__ virou {f.__name__!r}. Use @functools.wraps(func).\")\n            r1 = f(\"0xFF\")\n            exigir(r1 == 255, f\"decifrar(\\\"0xFF\\\") deveria devolver 255, mas devolveu {curto(r1)}.\")\n            try:\n                f(\"zz\")\n            except ValueError:\n                pass\n            else:\n                raise Reprova(\"decifrar(\\\"zz\\\") deveria deixar o ValueError subir (registre e use raise de novo), mas nenhuma exceção saiu.\")\n            esperado = [(\"decifrar\", (\"0xFF\",), {}, 255), (\"decifrar\", (\"zz\",), {}, \"erro: ValueError\")]\n        exigir(len(reg) == len(esperado), f\"Depois das chamadas, REGISTRO tem {len(reg)} item(ns), mas deveria ter {len(esperado)}: {curto(reg, 300)}\")\n        for i, (v, e) in enumerate(zip(reg, esperado)):\n            exigir(tuple(v) == e if isinstance(v, (tuple, list)) else False, f\"REGISTRO[{i}] deveria ser {e!r}, mas é {curto(v)}.\")\n            painel.append(repr(e))\n        return {\"ok\": True, \"painel\": painel}\n\n\n@missao\nclass Tentativas(Missao):\n    id = \"n3\"\n    extras = '''\nclass ConexaoInstavel(Exception):\n    pass\n\nclass Firewall(Exception):\n    pass\n'''\n    casos = [\n        {\"n\": 3, \"exc\": [\"ConexaoInstavel\"], \"falhas\": 2, \"tipo\": \"ConexaoInstavel\"},\n        {\"n\": 3, \"exc\": [\"ConexaoInstavel\"], \"falhas\": 5, \"tipo\": \"ConexaoInstavel\"},\n        {\"n\": 4, \"exc\": [\"ConexaoInstavel\"], \"falhas\": 1, \"tipo\": \"Firewall\"},\n        {\"n\": 5, \"exc\": [\"ConexaoInstavel\", \"TimeoutError\"], \"falhas\": 3, \"tipo\": \"alternado\"},\n    ]\n    for c in casos:\n        c[\"mostra\"] = [f\"@tentativas({c['n']}, {', '.join(c['exc'])})\", \"def abrir_porta(codigo): ...\",\n                       f\"# a porta falha {c['falhas']} vez(es) com \" + {\"ConexaoInstavel\": \"ConexaoInstavel\", \"Firewall\": \"Firewall\", \"alternado\": \"ConexaoInstavel e TimeoutError alternados\"}[c[\"tipo\"]]]\n\n    def verificar(self, ns, caso, sim):\n        tentativas = pegar(ns, \"tentativas\")\n        excs = [ns.get(e) or {\"TimeoutError\": TimeoutError}[e] for e in caso[\"exc\"]]\n        chamadas = []\n        falhas = caso[\"falhas\"]\n        def abrir_porta(codigo):\n            \"Tenta abrir a porta.\"\n            chamadas.append(codigo)\n            k = len(chamadas)\n            if k <= falhas:\n                if caso[\"tipo\"] == \"Firewall\":\n                    raise ns[\"Firewall\"](\"bloqueado pelo firewall\")\n                if caso[\"tipo\"] == \"alternado\" and k % 2 == 0:\n                    raise TimeoutError(\"sem resposta\")\n                raise ns[\"ConexaoInstavel\"](f\"falha {k}\")\n            return f\"porta {codigo} aberta\"\n        dec = tentativas(caso[\"n\"], *excs)\n        exigir(callable(dec), \"tentativas(n, ...) precisa devolver um decorador (uma função que recebe a função).\")\n        f = dec(abrir_porta)\n        exigir(callable(f), \"O decorador precisa devolver uma função.\")\n        exigir(getattr(f, \"__name__\", \"\") == \"abrir_porta\", \"A função decorada perdeu o nome. Use @functools.wraps(func) no envelope.\")\n        n = caso[\"n\"]\n        if caso[\"tipo\"] == \"Firewall\":\n            try:\n                f(\"7A\")\n            except ns[\"Firewall\"]:\n                exigir(len(chamadas) == 1, f\"Firewall não está na lista de exceções, então deveria subir na hora, mas a porta foi chamada {len(chamadas)} vezes.\")\n            else:\n                raise Reprova(\"O erro Firewall não está na lista de exceções aceitas e deveria subir, mas nada foi lançado.\")\n            painel = [\"tentativa 1: Firewall → sobe na hora\"]\n        elif falhas >= n:\n            try:\n                r = f(\"7A\")\n            except tuple(excs) as e:\n                exigir(len(chamadas) == n, f\"Com {n} tentativas, a porta deveria ser chamada {n} vezes, mas foi chamada {len(chamadas)}.\")\n            else:\n                raise Reprova(f\"Depois de {n} falhas, a última exceção deveria subir, mas a função devolveu {curto(r)}.\")\n            painel = [f\"tentativa {i + 1}: falhou\" for i in range(n)] + [\"→ a última exceção sobe\"]\n        else:\n            r = f(\"7A\")\n            exigir(r == \"porta 7A aberta\", f\"A função decorada deveria devolver 'porta 7A aberta', mas devolveu {curto(r)}.\")\n            exigir(len(chamadas) == falhas + 1, f\"A porta deveria ser chamada {falhas + 1} vezes (falhas + o sucesso), mas foi chamada {len(chamadas)}.\")\n            painel = [f\"tentativa {i + 1}: falhou\" for i in range(falhas)] + [f\"tentativa {falhas + 1}: porta 7A aberta\"]\n        return {\"ok\": True, \"painel\": painel}\n\n\n# ===== Distrito 2: modelo de dados =====\nVETOR_PLANOS = [\n    ([(\"S\", 4), (\"L\", 6), (\"N\", 2), (\"L\", 2), (\"N\", 2), (\"L\", 4), (\"S\", 4), (\"L\", 1), (\"S\", 1)], {7: \"$\", 19: \"$\"}),\n    ([(\"L\", 3), (\"S\", 4), (\"L\", 5), (\"N\", 4), (\"L\", 3), (\"S\", 6), (\"O\", 2)], {5: \"$\", 14: \"$\", 22: \"$\"}),\n]\nVETOR_MAPAS = [(rota_mapa([d for d, k in p for _ in range(k)], mk), p) for p, mk in VETOR_PLANOS]\n\n\n@missao\nclass VetorM(Missao):\n    id = \"n4\"\n    casos = [{\"mapa\": m, \"plano\": p, \"nota\": \"Plano de voo: \" + \" \".join(f\"{k}×{d}\" for d, k in p)} for m, p in VETOR_MAPAS]\n\n    def verificar(self, ns, caso, sim):\n        V = pegar(ns, \"Vetor\", \"classe\")\n        a, b = V(2, -3), V(-1, 5)\n        exigir(repr(a) == \"Vetor(2, -3)\", f\"repr(Vetor(2, -3)) deveria ser 'Vetor(2, -3)', mas é {curto(repr(a))}.\")\n        s = a + b\n        exigir(isinstance(s, V) and repr(s) == \"Vetor(1, 2)\", f\"Vetor(2, -3) + Vetor(-1, 5) deveria dar Vetor(1, 2), mas deu {curto(s)}.\")\n        exigir(repr(a - b) == \"Vetor(3, -8)\", f\"Vetor(2, -3) - Vetor(-1, 5) deveria dar Vetor(3, -8), mas deu {curto(a - b)}.\")\n        exigir(repr(a * 3) == \"Vetor(6, -9)\", f\"Vetor(2, -3) * 3 deveria dar Vetor(6, -9), mas deu {curto(a * 3)}.\")\n        try:\n            r = 3 * a\n        except TypeError:\n            raise Reprova(\"3 * Vetor(2, -3) deu TypeError. Defina __rmul__ para multiplicar com o número na frente.\")\n        exigir(repr(r) == \"Vetor(6, -9)\", f\"3 * Vetor(2, -3) deveria dar Vetor(6, -9), mas deu {curto(r)}.\")\n        exigir(repr(-a) == \"Vetor(-2, 3)\", f\"-Vetor(2, -3) deveria dar Vetor(-2, 3), mas deu {curto(-a)}.\")\n        exigir(abs(a) == 5, f\"abs(Vetor(2, -3)) deveria ser 5 (distância de Manhattan: |2| + |-3|), mas deu {curto(abs(a))}.\")\n        exigir(V(1, 2) == V(1, 2) and not (V(1, 2) == V(2, 1)), \"Dois vetores com os mesmos números precisam ser iguais (==), e diferentes se os números mudam.\")\n        exigir(len({V(1, 2), V(1, 2), V(0, 0)}) == 2, \"Vetores iguais precisam ter o mesmo hash: {Vetor(1, 2), Vetor(1, 2)} deveria ter 1 elemento. Defina __hash__.\")\n        l, c = V(4, 7)\n        exigir((l, c) == (4, 7), \"Desempacotar l, c = Vetor(4, 7) precisa dar 4 e 7. Defina __iter__.\")\n        exigir(not V(0, 0) and bool(V(0, 1)), \"Vetor(0, 0) precisa ser falso e qualquer outro verdadeiro. Defina __bool__.\")\n        DIRS = {d: V(*p) for d, p in PASSO.items()}\n        pos = V(sim.l, sim.c)\n        visitados = {pos}\n        for d, k in caso[\"plano\"]:\n            alvo = pos + DIRS[d] * k\n            for _ in range(k):\n                pos = pos + DIRS[d]\n                sim.mover(d)\n                exigir(tuple(pos) == (sim.l, sim.c), f\"Seu vetor de posição foi para {pos!r}, mas o drone está em ({sim.l}, {sim.c}).\")\n                visitados.add(pos)\n            exigir(pos == alvo, f\"pos + DIRS[{d!r}] * {k} deu {alvo!r}, mas andando casa a casa o drone chegou em {pos!r}.\")\n        executar_rota(sim, [])\n        return {\"ok\": True, \"nota\": f\"Voo concluído: {len(visitados)} casas diferentes visitadas, distância em linha reta {abs(pos - V(*achar(caso['mapa'], 'S')))}.\"}\n\n\nGRADE_MAPAS = [\n    [\"S..#....\", \".#.#.##.\", \".#...#..\", \".####.#.\", \"......#@\"],\n    [\"S.#.......\", \".##.####.#\", \"...#...#..\", \"##...#.#.#\", \"....##...@\"],\n]\n\n\n@missao\nclass GradeM(Missao):\n    id = \"n5\"\n    casos = [{\"mapa\": m, \"nota\": \"Mapa sem borda: fora dos limites conta como prédio.\"} for m in GRADE_MAPAS]\n\n    def verificar(self, ns, caso, sim):\n        G = pegar(ns, \"Grade\", \"classe\")\n        mapa = caso[\"mapa\"]\n        g = G(mapa)\n        H, W = len(mapa), len(mapa[0])\n        for pos in [(0, 0), (1, 1), (H - 1, W - 1), (2, 3)]:\n            exigir(g[pos] == mapa[pos[0]][pos[1]], f\"grade[{pos}] deveria ser {mapa[pos[0]][pos[1]]!r}, mas veio {curto(g[pos])}.\")\n        for pos in [(-1, 0), (0, -1), (H, 0), (0, W), (-1, -1)]:\n            v = g[pos]\n            exigir(v == \"#\", f\"grade[{pos}] está fora do mapa e deveria ser '#', mas veio {curto(v)}. Cuidado: índices negativos em listas pegam do fim!\", None)\n        exigir((0, 0) in g and (H - 1, W - 1) in g, \"(0, 0) e o canto oposto deveriam estar dentro da grade (operador in).\")\n        exigir((-1, 2) not in g and (H, 0) not in g and (0, W) not in g, \"Posições fora do mapa não podem estar na grade: (-1, 2) in grade deveria ser False.\")\n        livres = sum(ch != \"#\" for r in mapa for ch in r)\n        exigir(len(g) == livres, f\"len(grade) deveria contar as {livres} casas que não são prédio, mas deu {curto(len(g))}.\")\n        itens = list(g)\n        esperado = [((l, c), ch) for l, r in enumerate(mapa) for c, ch in enumerate(r)]\n        exigir(itens == esperado, f\"Percorrer a grade deveria dar pares ((linha, coluna), casa) em ordem de leitura. Os primeiros vieram assim: {curto(itens[:4])}\")\n        exigir(set(g.vizinhos((0, 0))) == {p for p in [(1, 0), (0, 1)] if mapa[p[0]][p[1]] != \"#\"}, f\"grade.vizinhos((0, 0)) deu {curto(list(g.vizinhos((0, 0))))}: deveria dar as casas livres ao redor, sem sair do mapa.\")\n        g2 = G(mapa)\n        g2[0, 1] = \"#\"\n        exigir(g2[0, 1] == \"#\" and g[0, 1] == mapa[0][1], \"grade[l, c] = valor precisa mudar só aquela grade (cada Grade com a sua cópia das linhas).\")\n        # a estação usa a sua Grade para achar o caminho\n        ini, fim = achar(mapa, \"S\"), achar(mapa, \"@\")\n        anterior = {ini: None}\n        fila = deque([ini])\n        while fila:\n            p = fila.popleft()\n            if p == fim:\n                break\n            for q in g.vizinhos(p):\n                exigir(q in g and g[q] != \"#\", f\"vizinhos devolveu {q}, que não é uma casa livre.\")\n                if q not in anterior:\n                    anterior[q] = p\n                    fila.append(q)\n        exigir(fim in anterior, \"Usando a sua Grade, a estação não achou caminho até o destino. Confira vizinhos().\")\n        caminho = []\n        p = fim\n        while anterior[p]:\n            a = anterior[p]\n            caminho.append(next(d for d, (dl, dc) in PASSO.items() if (a[0] + dl, a[1] + dc) == p))\n            p = a\n        executar_rota(sim, caminho[::-1])\n        return {\"ok\": True, \"nota\": f\"Caminho calculado com a sua Grade: {len(caminho)} movimentos.\"}\n\n\n@missao\nclass Camuflagem(Missao):\n    id = \"n6\"\n    extras = '''\nclass Detectado(Exception):\n    pass\n\nclass Drone:\n    def __init__(self, nome):\n        self.nome = nome\n        self.visivel = True\n        self.alertas = 0\n'''\n    casos = [{\"mostra\": [\"with camuflagem(vespa) as d:\", \"    d.coletar()          # nada acontece\"]},\n             {\"mostra\": [\"with camuflagem(vespa):\", \"    raise Detectado(\\\"câmera 4\\\")   # deve ser abafada\"]},\n             {\"mostra\": [\"with camuflagem(vespa):\", \"    raise ValueError(\\\"bateria\\\")   # deve subir\"]},\n             {\"mostra\": [\"with camuflagem(a):\", \"    with camuflagem(b):\", \"        raise Detectado(\\\"sensor\\\")\"]}]\n\n    def verificar(self, ns, caso, sim):\n        cam = pegar(ns, \"camuflagem\")\n        Drone, Detectado = ns[\"Drone\"], ns[\"Detectado\"]\n        k = self.casos.index(caso)\n        d = Drone(\"VESPA\")\n        ctx = cam(d)\n        exigir(hasattr(ctx, \"__enter__\") and hasattr(ctx, \"__exit__\"), \"camuflagem(drone) precisa devolver um gerenciador de contexto (com __enter__ e __exit__), para funcionar com with.\")\n        if k == 0:\n            with ctx as x:\n                exigir(x is d, \"with camuflagem(drone) as d: precisa entregar o próprio drone em d.\")\n                exigir(d.visivel is False, \"Dentro do with, drone.visivel precisa ser False.\")\n            exigir(d.visivel is True, \"Ao sair do with, drone.visivel precisa voltar a True.\")\n            return {\"ok\": True, \"painel\": [\"dentro: visivel = False\", \"depois: visivel = True\"]}\n        if k == 1:\n            try:\n                with ctx:\n                    raise Detectado(\"câmera 4\")\n            except Detectado:\n                raise Reprova(\"Detectado escapou do with. O __exit__ precisa devolver True quando a exceção for Detectado.\")\n            exigir(d.visivel is True, \"Mesmo com Detectado, drone.visivel precisa voltar a True.\")\n            exigir(d.alertas == 1, f\"Cada Detectado abafado soma 1 em drone.alertas, mas alertas = {d.alertas!r}.\")\n            return {\"ok\": True, \"painel\": [\"Detectado abafado\", \"alertas = 1, visivel = True\"]}\n        if k == 2:\n            try:\n                with ctx:\n                    raise ValueError(\"bateria\")\n            except ValueError:\n                pass\n            else:\n                raise Reprova(\"ValueError não é Detectado e deveria sair do with, mas foi abafado.\")\n            exigir(d.visivel is True, \"Mesmo quando a exceção sobe, drone.visivel precisa voltar a True.\")\n            exigir(d.alertas == 0, \"Só Detectado conta como alerta, mas alertas mudou com um ValueError.\")\n            return {\"ok\": True, \"painel\": [\"ValueError sobe\", \"visivel = True, alertas = 0\"]}\n        a, b = Drone(\"A\"), Drone(\"B\")\n        with cam(a):\n            with cam(b):\n                exigir(a.visivel is False and b.visivel is False, \"Com dois with aninhados, os dois drones precisam ficar invisíveis.\")\n                raise Detectado(\"sensor\")\n            exigir(a.visivel is False and b.visivel is True, \"Ao sair do with de dentro, só o drone B volta a ficar visível.\")\n        exigir(a.visivel and a.alertas == 0 and b.alertas == 1, f\"No fim: A deveria ter 0 alertas e B 1, mas A={a.alertas}, B={b.alertas}.\")\n        return {\"ok\": True, \"painel\": [\"B abafou o Detectado\", \"A continua escondido até o fim do with de fora\"]}\n\n\n# ===== Distrito 3: iteradores, geradores e corrotinas =====\ndef zigue(h, w):\n    for l in range(h):\n        cols = range(w) if l % 2 == 0 else range(w - 1, -1, -1)\n        for c in cols:\n            yield (l, c)\n\n\ndef sala(h, w, seed):\n    R = random.Random(seed)\n    g = [[\"#\"] * (w + 2) for _ in range(h + 2)]\n    for l in range(h):\n        for c in range(w):\n            g[l + 1][c + 1] = \".\"\n    seq = list(zigue(h, w))\n    for p in R.sample(seq[1:-1], max(1, h * w // 6)):\n        g[p[0] + 1][p[1] + 1] = \"$\"\n    ul, uc = seq[-1]\n    g[ul + 1][uc + 1] = \"@\"\n    g[1][1] = \"S\" if len(seq) > 1 else \"@\"\n    return [\"\".join(r) for r in g]\n\n\n@missao\nclass Varredura(Missao):\n    id = \"n7\"\n    tams = [(4, 6), (3, 1), (1, 5), (5, 4)]\n    casos = [{\"h\": h, \"w\": w, \"mapa\": sala(h, w, 40 + i), \"nota\": f\"Varredura({h}, {w})\"} for i, (h, w) in enumerate(tams)]\n\n    def verificar(self, ns, caso, sim):\n        V = pegar(ns, \"Varredura\", \"classe\")\n        exigir(hasattr(V, \"__next__\"), \"Varredura precisa ser um iterador de verdade: defina __iter__ e __next__ (um gerador não vale aqui).\")\n        h, w = caso[\"h\"], caso[\"w\"]\n        it = V(h, w)\n        exigir(iter(it) is it, \"iter(varredura) precisa devolver o próprio objeto (return self no __iter__).\")\n        esperado = list(zigue(h, w))\n        exigir(len(it) == h * w, f\"len(Varredura({h}, {w})) deveria ser {h * w}, mas deu {curto(len(it))}.\")\n        vistos = []\n        for k in range(h * w):\n            p = next(it)\n            exigir(tuple(p) == esperado[k], f\"A posição nº {k + 1} deveria ser {esperado[k]}, mas veio {curto(p)}.\", [[esperado[k][0] + 1, esperado[k][1] + 1]])\n            vistos.append(tuple(p))\n        try:\n            x = next(it)\n        except StopIteration:\n            pass\n        else:\n            raise Reprova(f\"Depois da última casa, next() deveria lançar StopIteration, mas devolveu {curto(x)}.\")\n        exigir(list(V(h, w)) == esperado or [tuple(p) for p in V(h, w)] == esperado, \"Uma Varredura nova precisa começar do início de novo.\")\n        movs = []\n        for (a, b), (c, d) in zip(vistos, vistos[1:]):\n            movs.append(\"S\" if c > a else \"N\" if c < a else \"L\" if d > b else \"O\")\n        executar_rota(sim, movs)\n        return {\"ok\": True, \"nota\": f\"{h * w} casas varridas em zigue-zague.\"}\n\n\nLOG_BASE = \"\"\"# log da rede — distrito 7\n02:14 SRV-1 INFO backup concluído\n02:15 SRV-2 ERRO porta 22 recusou conexão\n\n02:15 SRV-1 ERRO certificado expirado\n02:16 CAM-4 AVISO pouca luz\n02:17 SRV-2 ERRO senha incorreta para root\n# fim do bloco\n02:18 SRV-3 INFO rotina ok\n02:19 SRV-2 INFO login aceito\n02:20 CAM-4 ERRO câmera desligada por fora\"\"\"\n\n\n@missao\nclass Pipeline(Missao):\n    id = \"n8\"\n    casos = [{\"servidor\": None, \"mostra\": LOG_BASE.splitlines()[:5] + [\"…\"]},\n             {\"servidor\": \"SRV-2\", \"mostra\": [\"alertas(linhas, \\\"SRV-2\\\")\"]},\n             {\"servidor\": None, \"infinito\": True, \"mostra\": [\"fluxo = itertools.cycle(linhas)   # nunca termina\", \"list(itertools.islice(alertas(fluxo), 7))\"]}]\n\n    @staticmethod\n    def ref_eventos(linhas):\n        for linha in linhas:\n            linha = linha.strip()\n            if linha and not linha.startswith(\"#\"):\n                yield tuple(linha.split(maxsplit=3))\n\n    def verificar(self, ns, caso, sim):\n        eventos = pegar(ns, \"eventos\")\n        alertas = pegar(ns, \"alertas\")\n        linhas = LOG_BASE.splitlines()\n        g = eventos(iter(linhas))\n        exigir(inspect.isgenerator(g) or (hasattr(g, \"__next__\") and not isinstance(g, (list, tuple))), f\"eventos precisa ser um gerador (use yield), mas devolveu {type(g).__name__}.\")\n        ev = list(eventos(linhas))\n        esp = list(self.ref_eventos(linhas))\n        exigir([tuple(e) for e in ev] == esp, f\"eventos(linhas) deu {curto(ev, 260)}. O primeiro esperado era {esp[0]!r} (pule linhas vazias e as que começam com #).\")\n        if caso.get(\"infinito\"):\n            fluxo = itertools.cycle(linhas)\n            r = list(itertools.islice(alertas(fluxo), 7))\n            esp = list(itertools.islice((e for e in itertools.cycle(esp) if e[2] == \"ERRO\"), 7))\n            exigir([tuple(e) for e in r] == esp, f\"Com o fluxo infinito, os 7 primeiros alertas deveriam ser {curto(esp)}, mas vieram {curto(r)}.\")\n            return {\"ok\": True, \"painel\": [\" \".join(e) for e in esp], \"nota\": \"O pipeline é preguiçoso: leu só o necessário de um fluxo infinito.\"}\n        a = alertas(linhas, caso[\"servidor\"]) if caso[\"servidor\"] else alertas(linhas)\n        exigir(not isinstance(a, (list, tuple)), \"alertas precisa ser um gerador (use yield ou uma expressão geradora), não uma lista.\")\n        r = [tuple(x) for x in a]\n        esp2 = [e for e in esp if e[2] == \"ERRO\" and (caso[\"servidor\"] is None or e[1] == caso[\"servidor\"])]\n        exigir(r == esp2, f\"alertas deu {curto(r, 260)}, mas o certo é {curto(esp2, 260)}.\")\n        return {\"ok\": True, \"painel\": [\" \".join(e) for e in esp2]}\n\n\n@missao\nclass Monitor(Missao):\n    id = \"n9\"\n    seqs = [(50, 3, [40, 45, 70, 80, 20, 10, 90, 55]), (100, 1, [100, 101, 99, 150]), (30, 4, [10, 10, 10, 100, 0, 0, 0, 0, 40])]\n    casos = [{\"limite\": l, \"janela\": j, \"leituras\": s, \"mostra\": [f\"m = monitor({l}, {j})\", \"next(m)\", \"leituras: \" + \", \".join(map(str, s))]} for l, j, s in seqs]\n\n    def verificar(self, ns, caso, sim):\n        monitor = pegar(ns, \"monitor\")\n        m = monitor(caso[\"limite\"], caso[\"janela\"])\n        exigir(inspect.isgenerator(m), f\"monitor precisa ser uma corrotina feita com yield (um gerador), mas devolveu {type(m).__name__}.\")\n        outro = monitor(caso[\"limite\"], caso[\"janela\"])\n        p = next(m)\n        exigir(p is None, f\"O primeiro next(m) deveria devolver None (ainda não há leituras), mas devolveu {curto(p)}.\")\n        next(outro)\n        ultimas = deque(maxlen=caso[\"janela\"])\n        painel = []\n        for v in caso[\"leituras\"]:\n            ultimas.append(v)\n            media = sum(ultimas) / len(ultimas)\n            e = \"ALERTA\" if media > caso[\"limite\"] else \"OK\"\n            r = m.send(v)\n            exigir(r == e, f\"m.send({v}) devolveu {curto(r)}, mas a média das últimas {len(ultimas)} leituras é {media:g}, então o certo é {e!r}.\")\n            barra = \"█\" * max(1, round(v / 10))\n            painel.append(f\"{v:>4} {barra:<16} média {media:6.1f}  {e}\")\n        r = outro.send(0)\n        exigir(r == (\"ALERTA\" if 0 > caso[\"limite\"] else \"OK\"), \"Cada monitor precisa ter as suas próprias leituras: o segundo monitor foi afetado pelo primeiro.\")\n        return {\"ok\": True, \"painel\": painel}\n\n\n# ===== Distrito 4: metaprogramação =====\n@missao\nclass FaixaM(Missao):\n    id = \"n10\"\n    posludio = '''\nclass Implante:\n    potencia = Faixa(0, 100)\n    temperatura = Faixa(-20, 60)\n\n    def __init__(self, potencia, temperatura):\n        self.potencia = potencia\n        self.temperatura = temperatura\n'''\n    casos = [{\"mostra\": [\"class Implante:\", \"    potencia = Faixa(0, 100)\", \"    temperatura = Faixa(-20, 60)\", \"\", \"i = Implante(80, 36)\"]},\n             {\"mostra\": [\"i.potencia = 120     # ValueError: potencia fora da faixa: 120\", \"i.temperatura = -25  # ValueError\"]},\n             {\"mostra\": [\"a = Implante(10, 0)\", \"b = Implante(90, 50)   # cada um com os seus valores\", \"Implante.potencia     # o próprio descritor\"]}]\n\n    def verificar(self, ns, caso, sim):\n        F = pegar(ns, \"Faixa\", \"classe\")\n        exigir(hasattr(F, \"__set_name__\"), \"Faixa precisa de __set_name__ para descobrir o nome do atributo (potencia, temperatura).\")\n        exec(self.posludio, ns)\n        Imp = ns[\"Implante\"]\n        k = self.casos.index(caso)\n        if k == 0:\n            i = Imp(80, 36)\n            exigir(i.potencia == 80 and i.temperatura == 36, f\"Implante(80, 36) deveria ter potencia 80 e temperatura 36, mas tem {curto(i.potencia)} e {curto(i.temperatura)}.\")\n            i.potencia = 100\n            i.temperatura = -20\n            exigir(i.potencia == 100 and i.temperatura == -20, \"Os limites contam como dentro da faixa: potencia = 100 e temperatura = -20 são válidos.\")\n            return {\"ok\": True, \"painel\": [\"potencia = 80 ✓\", \"temperatura = 36 ✓\", \"limites 100 e -20 aceitos\"]}\n        if k == 1:\n            i = Imp(50, 20)\n            for attr, v in [(\"potencia\", 120), (\"temperatura\", -25), (\"potencia\", -1)]:\n                try:\n                    setattr(i, attr, v)\n                except ValueError as e:\n                    msg = f\"{attr} fora da faixa: {v}\"\n                    exigir(str(e) == msg, f\"A mensagem deveria ser {msg!r}, mas foi {str(e)!r}.\")\n                else:\n                    raise Reprova(f\"i.{attr} = {v} está fora da faixa e deveria lançar ValueError.\")\n            exigir(i.potencia == 50 and i.temperatura == 20, \"Um valor recusado não pode mudar o atributo: depois dos erros, potencia e temperatura deveriam continuar 50 e 20.\")\n            try:\n                Imp(150, 0)\n            except ValueError:\n                pass\n            else:\n                raise Reprova(\"Implante(150, 0) deveria falhar já no __init__ com ValueError.\")\n            return {\"ok\": True, \"painel\": [\"potencia = 120 → ValueError\", \"temperatura = -25 → ValueError\", \"valores antigos preservados\"]}\n        a, b = Imp(10, 0), Imp(90, 50)\n        exigir((a.potencia, b.potencia, a.temperatura, b.temperatura) == (10, 90, 0, 50), \"Cada Implante precisa guardar os seus próprios valores: guarde no objeto (obj.__dict__ ou setattr), não no descritor.\")\n        exigir(isinstance(Imp.potencia, F), \"Implante.potencia (acesso pela classe) deveria devolver o próprio descritor: no __get__, se obj for None, return self.\")\n        return {\"ok\": True, \"painel\": [\"a.potencia = 10, b.potencia = 90\", \"Implante.potencia → Faixa\"]}\n\n\ndef script_movs(script):\n    d, movs = \"L\", []\n    for linha in script.splitlines():\n        cmd, _, arg = linha.partition(\" \")\n        if cmd == \"AVANCAR\":\n            movs += [d] * int(arg)\n        elif cmd == \"GIRAR\":\n            d = (GIRO_D if arg == \"D\" else GIRO_E)[d]\n        elif cmd == \"RECUAR\":\n            movs += [GIRO_D[GIRO_D[d]]] * int(arg)\n        else:\n            break\n    return movs\n\n\nSCRIPTS = [\n    (\"AVANCAR 4\\nGIRAR D\\nAVANCAR 3\\nGIRAR E\\nAVANCAR 5\\nRECUAR 2\\nGIRAR E\\nAVANCAR 3\\nGIRAR D\\nAVANCAR 4\", None, {6: \"$\"}),\n    (\"AVANCAR 2\\nGIRAR E\\nAVANCAR 2\\nGIRAR D\\nAVANCAR 6\\nGIRAR D\\nAVANCAR 5\\nGIRAR D\\nAVANCAR 2\\nRECUAR 4\\nGIRAR E\\nAVANCAR 2\", None, {8: \"$\", 15: \"$\"}),\n    (\"AVANCAR 4\\nGIRAR D\\nAVANCAR 2\\nRECUAR 1\\nGIRAR E\\nAVANCAR 2\\nVOAR 3\\nAVANCAR 4\", \"VOAR\", {}),\n]\nSCRIPT_MAPAS = [(rota_mapa(script_movs(sc), mk), sc, e) for sc, e, mk in SCRIPTS]\n\n\n@missao\nclass Script(Missao):\n    id = \"n11\"\n    casos = [{\"mapa\": m, \"script\": s, \"erro\": e, \"direcao\": \"L\", \"nota\": \"Script: \" + \" · \".join(s.splitlines())} for m, s, e in SCRIPT_MAPAS]\n\n    def verificar(self, ns, caso, sim):\n        P = pegar(ns, \"Programa\", \"classe\")\n        rodar = pegar(ns, \"rodar_script\")\n        CD = pegar(ns, \"ComandoDesconhecido\", \"classe\")\n        exigir(issubclass(CD, Exception), \"ComandoDesconhecido precisa herdar de Exception.\")\n        exigir(isinstance(getattr(P, \"registro\", None), dict), \"Programa precisa ter o atributo de classe registro = {}.\")\n        for nome in (\"AVANCAR\", \"GIRAR\"):\n            exigir(nome in P.registro, f\"O comando {nome!r} não está em Programa.registro. As subclasses precisam se registrar sozinhas (__init_subclass__).\")\n\n        # a estação cria um comando novo, sem mexer no seu código\n        def executar(self, drone, argumento):\n            drone.girar(\"D\"); drone.girar(\"D\")\n            for _ in range(int(argumento)):\n                drone.avancar()\n            drone.girar(\"D\"); drone.girar(\"D\")\n        type(\"Recuar\", (P,), {\"comando\": \"RECUAR\", \"executar\": executar})\n        exigir(\"RECUAR\" in P.registro, \"A estação criou class Recuar(Programa) com comando = \\\"RECUAR\\\", mas ele não apareceu no registro. Use __init_subclass__ na classe base.\")\n\n        class DroneScript:\n            def avancar(self_):\n                sim.avancar()\n\n            def girar(self_, lado):\n                sim.girar(lado)\n        d = DroneScript()\n        if caso[\"erro\"]:\n            try:\n                rodar(caso[\"script\"], d)\n            except CD as e:\n                exigir(str(e) == caso[\"erro\"], f\"ComandoDesconhecido deveria trazer o nome do comando ({caso['erro']!r}), mas trouxe {str(e)!r}.\")\n            else:\n                raise Reprova(f\"O comando {caso['erro']} não existe: rodar_script deveria lançar ComandoDesconhecido({caso['erro']!r}).\")\n            return {\"ok\": True, \"nota\": f\"Comando {caso['erro']} recusado com ComandoDesconhecido.\"}\n        rodar(caso[\"script\"], d)\n        executar_rota(sim, [])\n        return {\"ok\": True, \"nota\": f\"Registro: {', '.join(sorted(P.registro))}\"}\n\n\n@missao\nclass EspiaoM(Missao):\n    id = \"n12\"\n    extras = '''\nclass Servidor:\n    def __init__(self, nome):\n        self.nome = nome\n        self.versao = \"4.2\"\n        self._segredo_root = \"hunter2\"\n        self.arquivos = [\"planos.txt\", \"folha.csv\"]\n\n    def listar(self, pasta=\"/\"):\n        return [pasta + a for a in self.arquivos]\n\n    def baixar(self, arquivo, rapido=False):\n        return f\"{arquivo} baixado\"\n'''\n    casos = [{\"mostra\": [\"s = Espiao(Servidor(\\\"kessler-01\\\"))\", \"s.nome\", \"s.listar(\\\"/home/\\\")\", \"s.baixar(\\\"planos.txt\\\", rapido=True)\"]},\n             {\"mostra\": [\"s._segredo_root   # PermissionError\", \"s.inexistente     # AttributeError normal\"]}]\n\n    def verificar(self, ns, caso, sim):\n        E = pegar(ns, \"Espiao\", \"classe\")\n        S = ns[\"Servidor\"]\n        alvo = S(\"kessler-01\")\n        s = E(alvo)\n        exigir(isinstance(getattr(s, \"log\", None), list), \"O espião precisa ter self.log, uma lista que começa vazia.\")\n        exigir(s.log == [], f\"s.log deveria começar vazio, mas é {curto(s.log)}.\")\n        if self.casos.index(caso) == 0:\n            nome = s.nome\n            exigir(nome == \"kessler-01\", f\"s.nome deveria repassar o nome do servidor, mas deu {curto(nome)}.\")\n            r = s.listar(\"/home/\")\n            exigir(r == [\"/home/planos.txt\", \"/home/folha.csv\"], f\"s.listar(\\\"/home/\\\") deveria funcionar como no servidor, mas devolveu {curto(r)}.\")\n            r = s.baixar(\"planos.txt\", rapido=True)\n            exigir(r == \"planos.txt baixado\", f\"s.baixar(...) deveria devolver 'planos.txt baixado', mas devolveu {curto(r)}.\")\n            esp = [(\"nome\", None), (\"listar\", (\"/home/\",)), (\"baixar\", (\"planos.txt\",))]\n            exigir([tuple(x) for x in s.log] == esp, f\"s.log deveria ser {esp!r}, mas é {curto(s.log, 260)}.\")\n            alvo.versao = \"5.0\"\n            exigir(s.versao == \"5.0\", \"O espião não pode copiar os dados: s.versao precisa ler o valor atual do servidor.\")\n            return {\"ok\": True, \"painel\": [repr(x) for x in esp] + [repr((\"versao\", None))]}\n        try:\n            v = s._segredo_root\n        except PermissionError as e:\n            exigir(str(e) == \"acesso negado: _segredo_root\", f\"A mensagem deveria ser 'acesso negado: _segredo_root', mas foi {str(e)!r}.\")\n        else:\n            raise Reprova(f\"s._segredo_root deveria lançar PermissionError, mas devolveu {curto(v)}.\")\n        try:\n            s.inexistente\n        except AttributeError:\n            pass\n        else:\n            raise Reprova(\"s.inexistente não existe no servidor e deveria dar AttributeError.\")\n        exigir(all(x[0] != \"_segredo_root\" for x in s.log), \"Acessos negados não entram no log.\")\n        return {\"ok\": True, \"painel\": [\"_segredo_root → PermissionError\", \"inexistente → AttributeError\"]}\n\n\n# ===== Distrito 5: texto e interpretadores =====\nACESSOS_TXT = \"\"\"[23:41:07] 10.0.3.17 kira LOGIN_FALHOU\n[23:41:09] 10.0.3.17 kira LOGIN_FALHOU\n[23:41:15] 172.16.0.4 ze_ninguem LOGIN_OK\n[7:41:20] 10.0.3.17 kira LOGIN_FALHOU\n[23:42:01] 10.0.3.17 kira LOGIN_FALHOU\n[23:42:30] 10.0.3 root LOGIN_FALHOU\n[23:43:00] 192.168.1.66 root LOGIN_FALHOU\n  [23:43:02] 192.168.1.66 root LOGIN_FALHOU\n[23:43:05] 192.168.1.66 admin LOGIN_TALVEZ\n[23:44:10] 192.168.1.66 admin LOGIN_OK extra\n[00:00:01] 10.0.3.17 kira LOGIN_OK\n[23:59:59] 8.8.8.8 visitante LOGIN_FALHOU\"\"\"\n\nPADRAO_REF = re.compile(r\"\\[(\\d\\d):(\\d\\d):(\\d\\d)\\] (\\d+\\.\\d+\\.\\d+\\.\\d+) (\\w+) (LOGIN_OK|LOGIN_FALHOU)\")\n\n\ndef ref_acessos(texto):\n    out = []\n    for linha in texto.splitlines():\n        m = PADRAO_REF.fullmatch(linha.strip())\n        if m:\n            h, mi, s, ip, u, ev = m.groups()\n            out.append((int(h) * 3600 + int(mi) * 60 + int(s), ip, u, ev == \"LOGIN_OK\"))\n    return out\n\n\n@missao\nclass Acessos(Missao):\n    id = \"n13\"\n    casos = [{\"limite\": 3, \"mostra\": ACESSOS_TXT.splitlines()[:6] + [\"…\"]},\n             {\"limite\": 2, \"mostra\": [\"suspeitos(acessos, 2)\"]},\n             {\"limite\": 1, \"texto\": \"linha quebrada\\n[12:00:00] 1.2.3.4 neo LOGIN_OK\\n\", \"mostra\": [\"linha quebrada\", \"[12:00:00] 1.2.3.4 neo LOGIN_OK\"]}]\n\n    def verificar(self, ns, caso, sim):\n        A = pegar(ns, \"Acesso\", \"classe\")\n        ler = pegar(ns, \"ler_acessos\")\n        susp = pegar(ns, \"suspeitos\")\n        exigir(dataclasses.is_dataclass(A), \"Acesso precisa ser uma dataclass: coloque @dataclass(frozen=True) em cima da classe.\")\n        nomes = [f.name for f in dataclasses.fields(A)]\n        exigir(nomes == [\"hora\", \"ip\", \"usuario\", \"sucesso\"], f\"Os campos de Acesso devem ser hora, ip, usuario e sucesso, nessa ordem; vieram {nomes}.\")\n        texto = caso.get(\"texto\", ACESSOS_TXT)\n        r = ler(texto)\n        exigir(isinstance(r, list), f\"ler_acessos precisa devolver uma lista, mas devolveu {type(r).__name__}.\")\n        exigir(all(isinstance(a, A) for a in r), \"Cada item de ler_acessos precisa ser um Acesso.\")\n        got = [(a.hora, a.ip, a.usuario, a.sucesso) for a in r]\n        esp = ref_acessos(texto)\n        if got != esp:\n            sobra = [g for g in got if g not in esp]\n            falta = [e for e in esp if e not in got]\n            raise Reprova((\"Linhas que deveriam ser ignoradas (ou lidas com erro): \" + curto(sobra[:2]) + \". \" if sobra else \"\") +\n                          (\"Faltaram: \" + curto(falta[:2]) + \".\" if falta else \"\") + (\" A ordem também importa.\" if not sobra and not falta else \"\"))\n        if r:\n            try:\n                r[0].ip = \"0.0.0.0\"\n            except dataclasses.FrozenInstanceError:\n                pass\n            else:\n                raise Reprova(\"Acesso precisa ser imutável: use @dataclass(frozen=True).\")\n        s = susp(r, caso[\"limite\"])\n        falhas = Counter(e[1] for e in esp if not e[3])\n        es = {ip for ip, n in falhas.items() if n >= caso[\"limite\"]}\n        exigir(isinstance(s, (set, frozenset)), f\"suspeitos precisa devolver um conjunto, mas devolveu {type(s).__name__}.\")\n        exigir(s == es, f\"suspeitos(acessos, {caso['limite']}) deu {curto(s)}, mas o certo é {curto(es)}.\")\n        return {\"ok\": True, \"painel\": [f\"{len(esp)} acessos válidos\", f\"suspeitos: {sorted(es)}\"]}\n\n\nclass _Calc:\n    def __init__(self, txt):\n        self.t = re.findall(r\"\\d+|\\S\", txt); self.i = 0\n\n    def ver(self):\n        return self.t[self.i] if self.i < len(self.t) else None\n\n    def comer(self):\n        self.i += 1; return self.t[self.i - 1]\n\n    def expr(self):\n        v = self.termo()\n        while self.ver() in (\"+\", \"-\"):\n            v = v + self.termo() if self.comer() == \"+\" else v - self.termo()\n        return v\n\n    def termo(self):\n        v = self.fator()\n        while self.ver() in (\"*\", \"/\"):\n            v = v * self.fator() if self.comer() == \"*\" else v // self.fator()\n        return v\n\n    def fator(self):\n        tok = self.ver()\n        if tok is None:\n            raise SyntaxError(\"fim\")\n        self.comer()\n        if tok.isdigit():\n            return int(tok)\n        if tok == \"-\":\n            return -self.fator()\n        if tok == \"(\":\n            v = self.expr()\n            if self.ver() != \")\":\n                raise SyntaxError(\")\")\n            self.comer(); return v\n        raise SyntaxError(tok)\n\n\ndef ref_calc(txt):\n    c = _Calc(txt)\n    v = c.expr()\n    if c.ver() is not None:\n        raise SyntaxError(\"sobra\")\n    return v\n\n\n@missao\nclass Calc(Missao):\n    id = \"n14\"\n    validas = [[\"2 + 3 * 4\", \"(2 + 3) * 4\", \"10 - 4 - 3\", \"100 / 7 / 2\", \"-(3 + 4) * 2\"],\n               [\"2*(3+(4-1))*5\", \"7 - -2\", \"12 / (1 + 2) - 8 * -1\", \"  42  \", \"1 + 2 * 3 - 4 / 2 + (5)\"]]\n    invalidas = [[\"2 +\", \"(1 + 2\", \"3 $ 4\", \"\"], [\"1 2\", \"()\", \"4 * (2))\", \"* 3\"]]\n    casos = [{\"validas\": v, \"invalidas\": i, \"mostra\": [f\"calcular({x!r})\" for x in v] + [f\"calcular({x!r})  # ErroSintaxe\" for x in i]} for v, i in zip(validas, invalidas)]\n\n    def verificar(self, ns, caso, sim):\n        calc = pegar(ns, \"calcular\")\n        Err = pegar(ns, \"ErroSintaxe\", \"classe\")\n        exigir(issubclass(Err, Exception), \"ErroSintaxe precisa herdar de Exception.\")\n        painel = []\n        for e in caso[\"validas\"]:\n            esp = ref_calc(e)\n            r = calc(e)\n            exigir(r == esp and type(r) is int, f\"calcular({e!r}) devolveu {curto(r)}, mas o certo é {esp}.\")\n            painel.append(f\"{e.strip()} = {esp}\")\n        for e in caso[\"invalidas\"]:\n            try:\n                r = calc(e)\n            except Err:\n                painel.append(f\"{e!r} → ErroSintaxe\")\n            except Exception as x:\n                raise Reprova(f\"calcular({e!r}) lançou {type(x).__name__}, mas deveria lançar ErroSintaxe.\")\n            else:\n                raise Reprova(f\"calcular({e!r}) não é uma expressão válida e deveria lançar ErroSintaxe, mas devolveu {curto(r)}.\")\n        return {\"ok\": True, \"painel\": painel}\n\n\ndef ref_compilar(prog):\n    toks = re.findall(r\"\\d+|\\S\", prog)\n    pos = [0]\n\n    def item():\n        if pos[0] >= len(toks):\n            raise SyntaxError(\"fim\")\n        t = toks[pos[0]]; pos[0] += 1\n        if t in PASSO:\n            return [t]\n        if t.isdigit():\n            return int(t) * item()\n        if t == \"[\":\n            corpo = []\n            while pos[0] < len(toks) and toks[pos[0]] != \"]\":\n                corpo += item()\n            if pos[0] >= len(toks):\n                raise SyntaxError(\"]\")\n            pos[0] += 1\n            return corpo\n        raise SyntaxError(t)\n    out = []\n    while pos[0] < len(toks):\n        out += item()\n    return out\n\n\n@missao\nclass Linguagem(Missao):\n    id = \"n15\"\n    progs = [(\"3L 2[S L] N\", [\"2[L\", \"3\"], {4: \"$\"}),\n             (\"2[3L 2S] 4[O] 3S\", [\"L ] S\", \"2X\"], {7: \"$\", 12: \"$\"}),\n             (\"L 2[2[L S] N] 10S 3[2L]\", [\"[[L]\", \"4[ ]5\"], {9: \"$\", 16: \"$\"})]\n    casos = [{\"prog\": p, \"ruins\": r, \"mapa\": rota_mapa(ref_compilar(p), mk), \"nota\": f\"Programa: {p}\"} for p, r, mk in progs]\n\n    def verificar(self, ns, caso, sim):\n        comp = pegar(ns, \"compilar\")\n        Err = pegar(ns, \"ErroSintaxe\", \"classe\")\n        for e in caso[\"ruins\"]:\n            try:\n                r = comp(e)\n            except Err:\n                pass\n            except Exception as x:\n                raise Reprova(f\"compilar({e!r}) lançou {type(x).__name__}, mas deveria lançar ErroSintaxe.\")\n            else:\n                if e == \"4[ ]5\":\n                    raise Reprova(f\"compilar({e!r}) deveria lançar ErroSintaxe (o 5 no fim não repete nada), mas devolveu {curto(r)}.\")\n                raise Reprova(f\"compilar({e!r}) é um programa quebrado e deveria lançar ErroSintaxe, mas devolveu {curto(r)}.\")\n        r = comp(caso[\"prog\"])\n        esp = ref_compilar(caso[\"prog\"])\n        exigir(isinstance(r, list), f\"compilar precisa devolver uma lista, mas devolveu {type(r).__name__}.\")\n        if r != esp:\n            try:\n                executar_rota(sim, r, False, False)\n            except (Falha, Reprova):\n                pass\n            raise Reprova(f\"compilar({caso['prog']!r}) deu {curto(r)}, mas o certo é {curto(esp)}.\")\n        executar_rota(sim, r)\n        return {\"ok\": True, \"nota\": f\"{caso['prog']} → {len(r)} movimentos\"}\n\n\n# ===== Distrito 6: algoritmos =====\ndef mapa_custos(seed, w=17, h=11):\n    R = random.Random(seed)\n    g = [[\"#\"] * w for _ in range(h)]\n    for l in range(1, h - 1):\n        for c in range(1, w - 1):\n            if R.random() < 0.18 and not (l < 3 and c < 3) and not (l > h - 4 and c > w - 4):\n                continue\n            g[l][c] = str(R.choice([1, 1, 1, 2, 2, 3, 5, 8, 9]))\n    for c in range(1, w - 1):\n        if R.random() < 0.6:\n            g[h // 2][c] = \"9\"\n    g[1][1] = \"S\"\n    g[h - 2][w - 2] = \"@\"\n    return [\"\".join(r) for r in g]\n\n\ndef custo_casa(ch):\n    return int(ch) if ch.isdigit() else 1\n\n\ndef ref_dijkstra(mapa, ini, fim):\n    best = {ini: 0}\n    fila = [(0, ini)]\n    while fila:\n        d, p = heapq.heappop(fila)\n        if p == fim:\n            return d\n        if d > best[p]:\n            continue\n        for dl, dc in PASSO.values():\n            q = (p[0] + dl, p[1] + dc)\n            if mapa[q[0]][q[1]] == \"#\":\n                continue\n            nd = d + custo_casa(mapa[q[0]][q[1]])\n            if nd < best.get(q, 1 << 30):\n                best[q] = nd\n                heapq.heappush(fila, (nd, q))\n    return -1\n\n\n@missao\nclass Dijkstra(Missao):\n    id = \"n16\"\n    casos = []\n    for s in (5, 11, 23):\n        m = mapa_custos(s)\n        casos.append({\"mapa\": m, \"custos\": True, \"nota\": \"Número na rua = custo de entrar nela (trânsito).\"})\n\n    def verificar(self, ns, caso, sim):\n        f = pegar(ns, \"rota_barata\")\n        mapa = caso[\"mapa\"]\n        ini, fim = achar(mapa, \"S\"), achar(mapa, \"@\")\n        r = f(mapa, ini, fim)\n        executar_rota(sim, r, True, False)\n        best = ref_dijkstra(mapa, ini, fim)\n        exigir(sim.custo <= best, f\"A rota custou {sim.custo}, mas existe uma rota que custa {best}. Use Dijkstra (heapq) com o custo de cada casa.\")\n        return {\"ok\": True, \"nota\": f\"Custo total {sim.custo} (ótimo) em {len(r)} movimentos.\"}\n\n\ndef mapa_chips(seed, n, w=8, h=5):\n    R = random.Random(seed)\n    lab = labirinto(w, h, R, abrir=10)\n    livres = [(l, c) for l, r in enumerate(lab) for c, ch in enumerate(r) if ch == \".\" and (l, c) != (1, 1)]\n    fim = (len(lab) - 2, len(lab[0]) - 2)\n    livres.remove(fim)\n    for p in R.sample(livres, n):\n        lab[p[0]][p[1]] = \"$\"\n    lab[1][1] = \"S\"\n    lab[fim[0]][fim[1]] = \"@\"\n    return [\"\".join(r) for r in lab]\n\n\ndef labirinto(w, h, R, abrir=0):\n    W, H = w * 2 + 1, h * 2 + 1\n    g = [[\"#\"] * W for _ in range(H)]\n    vis = [[False] * w for _ in range(h)]\n    pilha = [(0, 0)]\n    vis[0][0] = True\n    g[1][1] = \".\"\n    while pilha:\n        x, y = pilha[-1]\n        viz = [(x + dx, y + dy, dx, dy) for dx, dy in ((1, 0), (-1, 0), (0, 1), (0, -1)) if 0 <= x + dx < w and 0 <= y + dy < h and not vis[y + dy][x + dx]]\n        if not viz:\n            pilha.pop(); continue\n        nx, ny, dx, dy = viz[int(R.random() * len(viz))]\n        vis[ny][nx] = True\n        g[y * 2 + 1 + dy][x * 2 + 1 + dx] = \".\"\n        g[ny * 2 + 1][nx * 2 + 1] = \".\"\n        pilha.append((nx, ny))\n    tent = 0\n    while abrir > 0 and tent < 2000:\n        tent += 1\n        x, y = 1 + int(R.random() * (W - 2)), 1 + int(R.random() * (H - 2))\n        if g[y][x] != \"#\":\n            continue\n        hor = g[y][x - 1] != \"#\" and g[y][x + 1] != \"#\" and g[y - 1][x] == \"#\" and g[y + 1][x] == \"#\"\n        ver = g[y - 1][x] != \"#\" and g[y + 1][x] != \"#\" and g[y][x - 1] == \"#\" and g[y][x + 1] == \"#\"\n        if hor or ver:\n            g[y][x] = \".\"; abrir -= 1\n    return g\n\n\ndef ref_tsp(mapa):\n    ini = achar(mapa, \"S\")\n    fim = achar(mapa, \"@\")\n    chips = [(l, c) for l, r in enumerate(mapa) for c, ch in enumerate(r) if ch == \"$\"]\n    pts = [ini] + chips\n    dist = {(i, j): bfs(mapa, pts[i], pts[j]) for i in range(len(pts)) for j in range(len(pts))}\n    dfim = [bfs(mapa, p, fim) for p in pts]\n\n    @functools.lru_cache(maxsize=None)\n    def best(a, falta):\n        if not falta:\n            return dfim[a]\n        return min(dist[(a, i)] + best(i, falta - {i}) for i in falta)\n    return best(0, frozenset(range(1, len(pts))))\n\n\n@missao\nclass Coleta(Missao):\n    id = \"n17\"\n    casos = [{\"mapa\": mapa_chips(s, n), \"nota\": f\"{n} chips de dados espalhados.\"} for s, n in ((2, 5), (9, 7), (31, 9))]\n\n    def verificar(self, ns, caso, sim):\n        f = pegar(ns, \"rota_coleta\")\n        mapa = caso[\"mapa\"]\n        r = f(mapa, achar(mapa, \"S\"))\n        executar_rota(sim, r)\n        best = ref_tsp(mapa)\n        exigir(len(r) <= best, f\"A rota coletou tudo em {len(r)} movimentos, mas dá para fazer em {best}.\")\n        return {\"ok\": True, \"nota\": f\"Todos os {sim.total} chips em {len(r)} movimentos (ótimo).\"}\n\n\nLASER_MAPAS = [['###############', '#S11#.........#', '#.#...#.#.###2#', '#.#.#.....#..2#', '#.#.###.#.02###', '#.22......#2.@#', '###############'], ['###############', '#S#......00...#', '#.#.#.#.#.#.#0#', '#11...#.11#..0#', '#.#.#.#.#.###.#', '#...#...#..22@#', '###############'], ['###############', '#S#.....00....#', '#1#.#.#.#.#.#0#', '#2#....11...#0#', '#2###.#.##.##.#', '#.....#......@#', '###############']]\n\n\ndef ref_laser(mapa):\n    ini = achar(mapa, \"S\")\n    vist = {(ini, 0)}\n    fila = deque([(ini, 0)])\n    while fila:\n        (l, c), t = fila.popleft()\n        if mapa[l][c] == \"@\":\n            return t\n        for dl, dc in list(PASSO.values()) + [(0, 0)]:\n            nl, nc = l + dl, c + dc\n            ch = mapa[nl][nc]\n            if ch == \"#\" or (ch in \"012\" and (t + 1) % 3 == int(ch)):\n                continue\n            k = ((nl, nc), (t + 1) % 3)\n            if k not in vist:\n                vist.add(k)\n                fila.append(((nl, nc), t + 1))\n    return -1\n\n\n@missao\nclass Laser(Missao):\n    id = \"n18\"\n    casos = [{\"mapa\": m, \"lasers\": True, \"nota\": \"Laser k liga nos instantes t em que t % 3 == k.\"} for m in LASER_MAPAS]\n\n    def verificar(self, ns, caso, sim):\n        f = pegar(ns, \"rota_laser\")\n        mapa = caso[\"mapa\"]\n        r = f(mapa, achar(mapa, \"S\"))\n        executar_rota(sim, r, True, False)\n        best = ref_laser(mapa)\n        exigir(len(r) <= best, f\"O drone chegou em {len(r)} instantes, mas dá para chegar em {best}.\")\n        return {\"ok\": True, \"nota\": f\"Núcleo alcançado no instante {len(r)} (ótimo), com {r.count('P')} espera(s).\"}\n\n\n# ---------------------------------------------------------------- execução\ndef _linha_aluno(tb):\n    linha = None\n    for fr in traceback.extract_tb(tb):\n        if fr.filename == \"aluno.py\":\n            linha = fr.lineno\n    return linha\n\n\ndef rodar(mid, k, codigo, limite=3.0):\n    m = MISSOES[mid]\n    caso = m.casos[k]\n    saida = io.StringIO()\n    sim = m.sim(caso)\n    out = {\"ok\": False}\n    try:\n        code = compile(codigo, \"aluno.py\", \"exec\")\n    except SyntaxError as e:\n        return json.dumps({\"erro\": {\"tipo\": \"sintaxe\", \"cls\": type(e).__name__, \"msg\": e.msg, \"linha\": e.lineno}})\n    ns = {\"__name__\": \"__main__\"}\n    if m.extras:\n        exec(m.extras, ns)\n    fim = time.monotonic() + limite\n\n    def tr(frame, ev, arg):\n        if time.monotonic() > fim:\n            raise Estouro()\n        return tr\n    try:\n        with redirect_stdout(saida):\n            sys.settrace(tr)\n            try:\n                exec(code, ns)\n                res = m.verificar(ns, caso, sim)\n            finally:\n                sys.settrace(None)\n        out = {\"res\": res}\n    except Estouro:\n        out = {\"erro\": {\"tipo\": \"tempo\"}}\n    except Falha as e:\n        out = {\"res\": {\"ok\": False, \"msg\": str(e)}}\n    except Reprova as e:\n        out = {\"res\": {\"ok\": False, \"msg\": e.msg, \"destaque\": e.destaque}}\n    except RecursionError as e:\n        out = {\"erro\": {\"tipo\": \"excecao\", \"cls\": \"RecursionError\", \"msg\": \"recursão profunda demais\", \"linha\": _linha_aluno(e.__traceback__)}}\n    except Exception as e:\n        out = {\"erro\": {\"tipo\": \"excecao\", \"cls\": type(e).__name__, \"msg\": str(e), \"linha\": _linha_aluno(e.__traceback__)}}\n    out[\"trace\"] = sim.trace if sim else []\n    out[\"saida\"] = saida.getvalue()[:4000]\n    return json.dumps(out, ensure_ascii=False, default=repr)\n\n\ndef casos_json():\n    return json.dumps({mid: [{k: v for k, v in c.items() if k in (\"mapa\", \"nota\", \"mostra\", \"lasers\", \"custos\", \"direcao\", \"inicio\")} for c in m.casos]\n                       for mid, m in MISSOES.items()}, ensure_ascii=False)\n";
const STDLIB = "python_stdlib.zip";
</script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem("pn:"+k); return v===null ? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem("pn:"+k, JSON.stringify(v)); }catch(e){} }
};
const DISTRITOS = DADOS.distritos;
const MISSOES = DADOS.missoes.map(m => Object.assign(m, { casos: DADOS.casos[m.id] }));
function linhasDeCodigo(code){
  let doc = null, n = 0;
  for (const raw of code.split("\n")){
    const t = raw.trim();
    if (doc){ if (t.includes(doc)) doc = null; continue; }
    const q = t.startsWith('"""') ? '"""' : t.startsWith("'''") ? "'''" : null;
    if (q){ if (!t.slice(3).includes(q)) doc = q; continue; }
    if (!t || t.startsWith("#") || t.startsWith("import ") || t.startsWith("from ") || t.startsWith("@")) continue;
    n++;
  }
  return n;
}
MISSOES.forEach(m => { m.par = linhasDeCodigo(m.solution) + 1; });
let stars = store.get("stars", {});
let speed = store.get("speed", 160);
let runId = 0;
let cur = null, ready = false, running = false, abort = false, attempts = 0, shownMap = 0, mapStatus = [];
let engineMsg = "carregando Python…";
const isPhone = () => window.matchMedia("(max-width:1020px)").matches;
const starsFor = (m, code) => { const n = linhasDeCodigo(code); return n <= m.par ? 3 : n <= Math.ceil(m.par*1.4) ? 2 : 1; };
const unlocked = i => i===0 || (stars[MISSOES[i-1].id]||0) > 0;
const totalStars = () => Object.values(stars).reduce((a,b)=>a+b,0);
const starsHtml = n => [1,2,3].map(i=>`<span class="${i<=n?"on":""}">★</span>`).join("");
function updateStarCount(){ $("#starCount").textContent = `${totalStars()} / ${MISSOES.length*3}`; }
const DL = { N:[-1,0], S:[1,0], L:[0,1], O:[0,-1] };

/* ---------------- mapa de missões ---------------- */
function showLevels(){
  stopRun(); cur = null; store.set("cur", null);
  const nextI = MISSOES.findIndex(m=>!(stars[m.id]>0));

function highlight(cells){ for (const [l, c] of cells || []){ const el = $(`[data-c="${l},${c}"]`); if (el && !el.querySelector(".hl")) el.insertAdjacentHTML("beforeend", `<span class="hl"></span>`); } }

const wait = ms => new Promise(r=>setTimeout(r, ms));

  $("#board").style.setProperty("--spd", speed+"ms");

/* ---------------- execução ---------------- */
function explain(err){
  const line = err.linha ? ` (linha ${err.linha})` : "";
  if (err.tipo === "sintaxe"){
    let hint = "Confira os dois-pontos no fim de def, if, for, while, with e class, os parênteses e a indentação (4 espaços por nível).";
    if (/Indentation|TabError/.test(err.cls)) hint = "A indentação não bate: cada bloco usa 4 espaços a mais que a linha de cima, e linhas do mesmo bloco ficam alinhadas.";
    return { msg: `Erro de sintaxe${line}: ${err.msg}`, hint };
  }
  if (err.tipo === "tempo") return { msg: "O código passou de 3 segundos e a estação cortou a conexão.", hint: "Algum laço nunca termina, ou o algoritmo faz trabalho demais (por exemplo, testar todas as combinações em vez de guardar resultados)." };
  if (err.tipo === "excecao"){
    let hint = "Uma exceção escapou do seu código sem ser tratada.";
    const H = { NameError:"Você usou um nome que não existe. Confira a grafia, e se a variável foi criada antes ou importada.",
      UnboundLocalError:"Você reatribuiu uma variável de fora dentro de uma função interna. Use nonlocal (ou global) para dizer que ela é de fora.",
      IndexError:"Você acessou uma posição fora da lista ou da string.", KeyError:"Você leu uma chave que não está no dicionário. Use in ou .get().",
      TypeError:"Algum valor é de um tipo diferente do esperado, ou uma função foi chamada com argumentos a mais ou a menos.",
      AttributeError:"O objeto não tem esse atributo ou método. Confira a grafia e se ele foi criado no __init__.",
      ValueError:"Um valor tem o tipo certo mas o conteúdo errado.", RecursionError:"A recursão não parou. Confira o caso base.",
      StopIteration:"Um next() chegou ao fim de um iterador sem ninguém tratar.", ZeroDivisionError:"Houve uma divisão por zero.",
      NotImplementedError:"Um método da classe base foi chamado: a subclasse precisa sobrescrevê-lo." };
    if (H[err.cls]) hint = H[err.cls];
    return { msg: `${err.cls}${err.msg ? ": " + err.msg : ""}${line}`, hint };
  }
  return { msg: err.msg || "erro desconhecido", hint: "" };
}
async function runAll(){
  if (!ready || running) return;
  const m = MISSOES[cur], code = codeEl.value;
  codeEl.blur(); fbEl.innerHTML = "";
  for (const [re, msg] of (m.forbid||[])) if (new RegExp(re).test(code)) return fail(msg);
  running = true; abort = false; attempts++;
  const myRun = ++runId;
  $("#run").hidden = true; $("#stop").hidden = false;
  mapStatus = m.casos.map(()=>null); renderMaps();
  if (isPhone()) $(".boardcard").scrollIntoView({behavior:"smooth", block:"start"});
  let allOk = true;
  for (let k = 0; k < m.casos.length; k++){
    shownMap = k; renderMaps(); resetBoard();
    await wait(k>0 ? 300 : 40);
    if (myRun !== runId) return;
    let r;
    try { r = JSON.parse(rodarPy(m.id, k, code)); } catch (e){ r = { erro: { tipo: "interno", msg: String(e && e.message || e).split("\n").slice(-2).join(" ") } }; }
    if (r.erro && r.erro.tipo === "sintaxe"){ allOk = false; const { msg, hint } = explain(r.erro); mapStatus[k] = false; renderMaps(); fail(msg, hint); break; }
    const done = (!B.semMapa && r.trace) ? await animate(r.trace) : true;
    if (myRun !== runId) return;
    $("#out").textContent = (r.saida || "").trim();
    if (!done){ allOk = false; fbEl.innerHTML = `<div class="feedback bad"><b>Invasão abortada</b>Ajuste o código e execute de novo.</div>`; break; }
    const pre = m.casos.length>1 ? `${casoLabel(m,k)}: ` : "";

    const res = r.res;
    if (res.destaque) highlight(res.destaque);
    if (!res.ok){ mapStatus[k] = false; renderMaps(); allOk = false; fail(pre + res.msg, ""); break; }
    if (res.nota) $("#note").textContent = res.nota;
    if (res.painel && B.semMapa){ $("#board").querySelector(".tela").insertAdjacentHTML("beforeend", "\n\n" + res.painel.map(l=>`<span class="res">✓</span> ${esc(l)}`).join("\n")); }

}

/* ---------------- editor ---------------- */
function syncGutter(){
  if (!codeEl) return;
  const n = codeEl.value.split("\n").length;
  gutterEl.textContent = Array.from({length:n},(_,i)=>i+1).join("\n");
  codeEl.style.height = "auto"; codeEl.style.height = codeEl.scrollHeight+"px";
  const pw = codeEl.parentElement.clientWidth-42;
  codeEl.style.width = "auto"; codeEl.style.width = Math.max(pw, codeEl.scrollWidth)+"px";
}
function insert(t, back=0){
  codeEl.setRangeText(t, codeEl.selectionStart, codeEl.selectionEnd, "end");
  if (back){ const p = codeEl.selectionStart-back; codeEl.setSelectionRange(p,p); }
  codeEl.dispatchEvent(new Event("input"));
}
function newline(){
  const v = codeEl.value, s = codeEl.selectionStart;
  const line = v.slice(v.lastIndexOf("\n", s-1)+1, s);
  let ind = line.match(/^ */)[0];
  if (/:\s*(#.*)?$/.test(line)) ind += "    ";
  insert("\n"+ind);
}
function dedent(){
  const v = codeEl.value, s = codeEl.selectionStart, ls = v.lastIndexOf("\n", s-1)+1;
  const sp = v.slice(ls).match(/^ {1,4}/);
  if (sp){ codeEl.setRangeText("", ls, ls+sp[0].length, "end"); const p = Math.max(ls, s-sp[0].length); codeEl.setSelectionRange(p,p); codeEl.dispatchEvent(new Event("input")); }
}
function setupEditor(){
  codeEl.addEventListener("input", ()=>{ syncGutter(); saveCode(); });
  codeEl.addEventListener("keydown", e=>{
    const v = codeEl.value, s = codeEl.selectionStart, en = codeEl.selectionEnd;
    if ((e.ctrlKey||e.metaKey) && e.key==="Enter"){ e.preventDefault(); runAll(); return; }
    if (e.key==="Tab"){ e.preventDefault(); e.shiftKey ? dedent() : insert("    "); return; }
    if (e.key==="Enter" && !e.isComposing){ e.preventDefault(); newline(); return; }
    if (e.key==="Backspace" && s===en){
      const before = v.slice(v.lastIndexOf("\n", s-1)+1, s);
      if (before.length && /^ +$/.test(before)){ e.preventDefault(); const k = (before.length-1)%4+1; codeEl.setRangeText("", s-k, s, "end"); codeEl.dispatchEvent(new Event("input")); }
    }
  });
  syncGutter();
}
const KEYS = [["⇥", "tab"], ["⇤", "dedent"], [":", ":"], ["( )", "()", 1], ["[ ]", "[]", 1], ["{ }", "{}", 1], ["\" \"", "\"\"", 1], ["_", "_"], ["=", "="], ["==", "=="], ["+=", "+="], [",", ", "], [".", "."], ["*", "*"], ["@", "@"], ["self", "self."], ["return", "return "], ["yield", "yield "], ["nonlocal", "nonlocal "], ["lambda", "lambda "], ["for", "for  in :", 5], ["if", "if :", 1], ["def", "def ():", 3], ["↵", "enter"]];
function setupKeys(){
  const kb = $("#keys"); kb.innerHTML = "";

    const b = document.createElement("button"); b.type="button"; b.textContent=label;
    b.setAttribute("aria-label", val==="tab"?"Recuar":val==="dedent"?"Desfazer recuo":val==="enter"?"Nova linha":"Inserir "+val.trim());
    b.addEventListener("pointerdown", e=>e.preventDefault());
    b.onclick = ()=>{ if (document.activeElement!==codeEl) codeEl.focus();
      if (val==="tab") insert("    "); else if (val==="dedent") dedent(); else if (val==="enter") newline(); else insert(val, back||0); };
    kb.appendChild(b);
  });
}
let lastW = window.innerWidth;
window.addEventListener("resize", ()=>{
  if (Math.abs(window.innerWidth - lastW) < 40) return;
  lastW = window.innerWidth;
  if (cur!==null && !running){ resetBoard(); syncGutter(); }
});

let rodarPy = null;
function loadScript(src){ return new Promise((res, rej)=>{ const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
function setEngine(t){ engineMsg = t; const e = $("#engine"); if (e) e.textContent = t; }
async function loadEngine(){
  try {
    setEngine("baixando Python 3.12 (13 MB, só na primeira vez)…");
    await loadScript("pyodide/pyodide.js");
    const base = new URL("pyodide/", document.baseURI).href;
    const py = await loadPyodide({ indexURL: base, stdLibURL: base + STDLIB });
    setEngine("preparando a estação…");
    py.FS.writeFile("/home/pyodide/banca.py", BANCA_PY);
    py.runPython("import sys; sys.path.insert(0, '/home/pyodide'); import banca");
    rodarPy = py.globals.get("banca").rodar;
    return true;
  } catch (e){ console.error(e); return false; }
}
(async ()=>{
  updateStarCount();
  const c = store.get("cur", null);
  if (c!==null && MISSOES[c] && unlocked(c)) openLevel(c); else showLevels();
  ready = await loadEngine();
  setEngine(ready ? "Python 3.12 pronto" : "o Python não carregou");
  const run = $("#run"); if (run) run.disabled = !ready;
  if (!ready && fbEl) fbEl.innerHTML = `<div class="feedback bad"><b>O Python não carregou</b>Confira a conexão com a internet e recarregue a página.</div>`;
})();
</script>

<script>
/* Navegação comum do Código em Jogo:
   - nos jogos: botão "← (lista)" dentro da missão e o "voltar" do celular volta para a lista de missões;
   - nos cursos: o "voltar" do celular volta para o mapa do curso;
   - em todas as telas: botão "Início" no topo, que volta para a página do Código em Jogo. */
(function(){
  var css = document.createElement("style");
  css.textContent = ".cj-voltar{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;padding:6px 14px 6px 10px;border-radius:99px;border:1.5px solid currentColor;background:transparent;color:inherit;font:inherit;font-weight:700;font-size:.86rem;line-height:1.2;cursor:pointer;opacity:.8;min-height:36px}" +
    ".cj-voltar:hover,.cj-voltar:focus-visible{opacity:1}" +
    ".cj-portal{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px;font-weight:700;font-size:.88rem;color:inherit;opacity:.75;text-decoration:none}" +
    ".cj-portal:hover,.cj-portal:focus-visible{opacity:1;text-decoration:underline}" +
    ".cj-inicio{display:inline-flex;align-items:center;gap:6px;text-decoration:none}" +
    ".cj-inicio svg{width:18px;height:18px;flex:none}" +
    ".cj-inicio-c{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;padding:6px 12px 6px 9px;border:1.5px solid currentColor;border-radius:99px;font-weight:700;font-size:.82rem;line-height:1.2;color:inherit;text-decoration:none;opacity:.8}" +
    ".cj-inicio-c:hover,.cj-inicio-c:focus-visible{opacity:1}" +
    ".cj-inicio-c svg{width:16px;height:16px;flex:none}" +
    "@media (max-width:600px){.cj-inicio span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.cj-inicio{padding-left:11px!important;padding-right:11px!important}}";
  document.head.appendChild(css);
  var PORTAL = "/";
  var CASA = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.8V20h13V9.8"/><path d="M10 20v-5.5h4V20"/></svg>';
  // jogos: botão no cabeçalho, ao lado da lista de missões
  var topo = document.querySelector(".top-r");
  if (topo && !topo.querySelector(".cj-inicio")){
    var a1 = document.createElement("a");
    a1.className = "btn cj-inicio"; a1.href = PORTAL; a1.title = "Voltar para o Código em Jogo";
    a1.setAttribute("aria-label", "Início: voltar para o Código em Jogo");
    a1.innerHTML = CASA + "<span>Início</span>";
    topo.insertBefore(a1, topo.firstChild);
  }
  // cursos: botão no alto da barra lateral (no celular, no alto da página)
  var trilha = document.querySelector("aside.trail");
  if (trilha && !trilha.querySelector(".cj-inicio-c")){
    var a2 = document.createElement("a");
    a2.className = "cj-inicio-c"; a2.href = PORTAL; a2.title = "Voltar para o Código em Jogo";
    a2.innerHTML = CASA + "<span>Código em Jogo</span>";
    trilha.insertBefore(a2, trilha.firstChild);
  }
  function linkPortal(){ return document.createComment("início no topo"); }

  /* ---------- jogos ---------- */
  if (typeof openLevel === "function" && typeof showLevels === "function"){
    var btn = document.getElementById("levelsBtn");
    var rotulo = btn ? btn.textContent.trim() : "Missões";
    var abrir = openLevel, lista = showLevels;
    var naMissao = false, voltando = false;
    try { history.replaceState({ cj: "lista" }, ""); } catch (e){}
    var poeBotao = function(){
      var m = document.getElementById("mission");
      if (!m || m.querySelector(".cj-voltar")) return;
      var b = document.createElement("button");
      b.type = "button"; b.className = "cj-voltar"; b.textContent = "← " + rotulo;
      b.setAttribute("aria-label", "Voltar para a lista de " + rotulo.toLowerCase());
      b.onclick = function(){ showLevels(); };
      m.insertBefore(b, m.firstChild);
    };
    var poePortal = function(){
      var v = document.getElementById("view");
      if (v && !v.querySelector(".cj-portal")) v.insertBefore(linkPortal(), v.firstChild);
    };
    var entrou = function(){
      if (!document.getElementById("mission")) return;
      if (!naMissao){ try { history.pushState({ cj: "missao" }, ""); } catch (e){} naMissao = true; }
      poeBotao();
    };
    openLevel = function(){ var r = abrir.apply(this, arguments); entrou(); return r; };
    showLevels = function(){
      var r = lista.apply(this, arguments);
      if (naMissao && !voltando){ naMissao = false; try { history.back(); } catch (e){} }
      naMissao = false;
      poePortal();
      return r;
    };
    window.addEventListener("popstate", function(){
      if (naMissao){ voltando = true; naMissao = false; try { showLevels(); } finally { voltando = false; } }
    });
    if (document.getElementById("mission")) entrou(); else poePortal();
    return;
  }

  /* ---------- cursos ---------- */
  if (typeof openItem === "function"){
    var abrirItem = openItem;
    var noItem = false, voltandoItem = false;
    try { history.replaceState({ cj: "mapa" }, ""); } catch (e){}
    var mapa = function(){
      var l = document.getElementById("lesson");
      if (l && !l.querySelector(".cj-portal")) l.insertBefore(linkPortal(), l.firstChild);
    };
    var depois = function(i){
      if (i === -1){
        if (noItem && !voltandoItem){ noItem = false; try { history.back(); } catch (e){} }
        noItem = false; mapa();
      } else if (!noItem){ try { history.pushState({ cj: "item" }, ""); } catch (e){} noItem = true; }
    };
    openItem = function(i){ var r = abrirItem.apply(this, arguments); depois(i); return r; };
    window.addEventListener("popstate", function(){
      if (noItem){ voltandoItem = true; noItem = false; try { openItem(-1); } finally { voltandoItem = false; } }
    });
    if (typeof current !== "undefined" && current !== -1) depois(current); else mapa();
  }
})();
</script>
