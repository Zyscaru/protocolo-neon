<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Jogo de Python avançado: closures, decoradores, modelo de dados, geradores, metaprogramação, interpretadores e algoritmos invadindo uma cidade cyberpunk.">
<meta name="theme-color" content="#0d0a14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Protocolo Neon">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Protocolo Neon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fira+Code:wght@400;600&display=swap">
<style>
/* Layout: terminal de invasão — briefing + editor à esquerda, câmera aérea da cidade fixa à direita.
   Visual único e escuro (noite de Neo-São Paulo, 2087), escolhido de propósito. */
:root{
  color-scheme: dark;
  --bg:#0d0a14; --panel:#161124; --panel-2:#1f1833; --ink:#efe9ff; --ink-soft:#a49cc0; --line:#342a52;
  --street:#120e1c; --street-2:#151021; --lane:rgba(51,225,255,.06); --roof:#241c3a; --roof-hi:#3a2e5c; --window:rgba(255,210,63,.55);
  --chip:#6dff9e; --laser:#ff2a3d; --term:#33e1ff;
  --accent:#ff3d8b; --accent-ink:#1a0410; --cool:#33e1ff; --mark:#ffd23f;
  --code-bg:#09070f; --code-fg:#ece6ff; --code-dim:#776e95; --key:#1c1530;
  --ok:#6dff9e; --ok-bg:#0f2a1c; --err:#ff8aa8; --err-bg:#331021; --star:#ffd23f; --star-off:#3a3156;
  --f-display:"Oxanium", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Barlow", "Segoe UI", system-ui, sans-serif;
  --f-code:"Fira Code", ui-monospace, Consolas, monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(900px 360px at 85% -120px, #3a1240 0%, transparent 65%), radial-gradient(700px 320px at 0% 0%, #10284a 0%, transparent 70%), var(--bg);background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.55;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--cool)}
:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1340px;margin:0 auto;padding-block:14px 4px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.6rem;letter-spacing:.06em;text-transform:uppercase;line-height:1;min-width:0}
.logo div{white-space:nowrap}
.logo .n{color:var(--accent);text-shadow:0 0 14px rgba(255,61,139,.55)}
.logo small{display:block;font-family:var(--f-body);font-weight:600;font-size:.7rem;letter-spacing:.18em;color:var(--ink-soft);margin-top:4px}
.logo svg{width:42px;height:42px;flex:none}
.top-r{display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:6px;white-space:nowrap;border:1.5px solid var(--line);background:var(--panel);border-radius:4px;padding:6px 12px;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.pill .st{color:var(--star)}
.btn{border:1.5px solid var(--line);background:var(--panel-2);border-radius:4px;padding:9px 16px;font-weight:700;font-size:.92rem;min-height:42px;color:var(--ink);letter-spacing:.02em}
.btn:hover{border-color:var(--ink-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 18px rgba(255,61,139,.35)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-soft);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

.wrap{max-width:1340px;margin:0 auto;padding-block:10px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"mission board" "editor board";gap:16px;align-items:start}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:6px;min-width:0}
.mission{grid-area:mission;padding:20px 22px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.boardcard{grid-area:board;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);padding:14px;display:flex;flex-direction:column;gap:10px}
.edcol{grid-area:editor;display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cool)}
.eyebrow .setor{color:var(--accent);margin-left:6px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,3vw,2.3rem);line-height:1.05;margin:6px 0 12px;letter-spacing:.01em;text-wrap:balance}
.mission p{margin:0 0 10px;max-width:64ch}
.mission code,.ref code{font-family:var(--f-code);font-size:.82em;background:var(--panel-2);padding:1px 5px;border-radius:3px;color:var(--ink)}
.mission pre{background:var(--code-bg);color:var(--code-fg);font-family:var(--f-code);font-size:.8rem;border-radius:4px;padding:10px 14px;margin:0 0 12px;overflow-x:auto;border:1px solid var(--line);border-left:3px solid var(--cool)}
.task{background:linear-gradient(135deg,#2c0c1d,#180914);border:1.5px solid var(--accent);border-radius:4px;padding:12px 14px;margin:6px 0 4px}
.task strong{display:block;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.14em;font-size:.8rem;color:var(--accent);margin-bottom:4px}
.task p{margin:0}
details.ref{margin-top:12px;border:1.5px solid var(--line);border-radius:4px;background:var(--panel-2)}
details.ref summary{cursor:pointer;padding:10px 14px;font-family:var(--f-display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:.85rem;color:var(--ink-soft);list-style:none}
details.ref summary::-webkit-details-marker{display:none}
details.ref summary::before{content:"▸ ";color:var(--cool)}
details.ref[open] summary::before{content:"▾ "}
.refbody{padding:0 14px 12px;display:flex;flex-direction:column;gap:10px;font-size:.9rem}
.refbody pre{background:var(--code-bg);color:var(--code-fg);font-family:var(--f-code);font-size:.8rem;border-radius:4px;padding:10px 14px;margin:4px 0 0;overflow-x:auto;border:1px solid var(--line)}
.goal{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.86rem;color:var(--ink-soft);margin-top:10px}
.goal b{color:var(--ink)}

/* editor */
.editor{background:var(--code-bg);border-radius:6px;overflow:hidden;border:1.5px solid var(--line)}
.ed-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px 9px 16px;border-bottom:1px solid var(--line);color:var(--code-dim);font-family:var(--f-code);font-size:.78rem}
.ed-body{display:grid;grid-template-columns:42px 1fr;min-height:260px;max-height:64vh;overflow:auto}
.gutter{padding:12px 8px 12px 0;text-align:right;font-family:var(--f-code);font-size:.84rem;line-height:1.6;color:#4f456e;user-select:none;white-space:pre;font-variant-numeric:tabular-nums}
#code{background:transparent;color:var(--code-fg);border:0;resize:none;outline:none;padding:12px 12px 12px 10px;font-family:var(--f-code);font-size:.84rem;line-height:1.6;white-space:pre;overflow:hidden;tab-size:4;caret-color:var(--accent);min-height:260px;width:100%}
.keys{display:flex;gap:6px;overflow-x:auto;padding:8px;border-top:1px solid var(--line);scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.keys button{flex:0 0 auto;min-width:40px;height:40px;padding:0 10px;border:0;border-radius:4px;background:var(--key);color:var(--code-fg);font-family:var(--f-code);font-size:.86rem}
.keys button:active{background:var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.speed{display:flex;border:1.5px solid var(--line);border-radius:4px;overflow:hidden;margin-left:auto}
.speed button{border:0;background:var(--panel);padding:8px 10px;font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.feedback{border-radius:4px;padding:12px 14px;font-size:.94rem;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
.feedback.ok{background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok)}
.feedback.bad{background:var(--err-bg);color:var(--err);border:1.5px solid var(--err)}
.feedback b{font-family:var(--f-display);font-size:1.02rem;letter-spacing:.08em;text-transform:uppercase}
.feedback .row{display:flex;gap:8px;flex-wrap:wrap}
.feedback .btn{font-size:.85rem;padding:6px 12px;min-height:36px}
.hint{color:var(--ink);background:var(--panel);border-radius:4px;padding:8px 10px;font-size:.88rem;white-space:pre-wrap}
.solution{background:var(--code-bg);color:var(--code-fg);border-radius:4px;padding:10px 12px;font-family:var(--f-code);font-size:.78rem;white-space:pre;overflow-x:auto;margin:0;border:1px solid var(--line);max-height:380px}

/* câmera aérea */
.bhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;font-family:var(--f-code)}
.bhead b{color:var(--ink)}
.maps{display:flex;gap:6px;flex-wrap:wrap}
.maps button{border:1.5px solid var(--line);background:var(--panel-2);border-radius:3px;padding:3px 9px;font-size:.76rem;font-weight:700;color:var(--ink-soft)}
.maps button[aria-current="true"]{border-color:var(--ink);color:var(--ink)}
.maps button.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.maps button.bad{border-color:var(--err);color:var(--err);background:var(--err-bg)}
.stage{position:relative;display:grid;place-items:center;background:linear-gradient(180deg,#140f22,#0b0812);border-radius:4px;padding:10px;overflow:hidden;min-height:220px;border:1px solid var(--line)}
.stage::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);pointer-events:none}
.board{position:relative;display:grid;gap:0;max-width:100%}
.cell{width:var(--c);height:var(--c);position:relative}
.cell.r{background:var(--street)}
.cell.r::before{content:"";position:absolute;inset:6%;background:var(--roof);border:1px solid var(--roof-hi);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.cell.r::after{content:"";position:absolute;inset:22%;background-image:radial-gradient(circle,var(--window) 0 1.4px,transparent 1.8px);background-size:calc(var(--c)*.2) calc(var(--c)*.2);opacity:var(--o,.6)}
.cell.r.v2::after{--o:.25}
.cell.r.v3::after{--o:0}
.cell.r.v3::before{background:linear-gradient(135deg,var(--roof-hi),var(--roof) 60%)}
.cell.s{background:var(--street);background-image:linear-gradient(90deg,var(--lane) 1px,transparent 1px),linear-gradient(0deg,var(--lane) 1px,transparent 1px);background-size:50% 50%}
.cell.s.alt{background-color:var(--street-2)}
.cell .cost{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-code);font-size:calc(var(--c)*.36);font-weight:600;color:rgba(255,255,255,.75);background:hsla(var(--h),90%,55%,var(--a))}
.pad{position:absolute;inset:22%;border:2px dashed var(--cool);border-radius:50%;opacity:.6}
.chip{position:absolute;left:50%;top:50%;width:40%;height:40%;transform:translate(-50%,-50%);background:var(--chip);border-radius:2px;box-shadow:0 0 10px var(--chip),0 0 0 2px var(--street),0 0 0 3px var(--chip);transition:transform .3s,opacity .3s;z-index:2}
.chip.got{transform:translate(-50%,-170%) scale(.3);opacity:0}
.term{position:absolute;inset:8%;border:2px solid var(--term);border-radius:3px;display:grid;place-items:center;box-shadow:0 0 12px var(--term),inset 0 0 8px var(--term);color:var(--term);font-family:var(--f-display);font-weight:800;font-size:calc(var(--c)*.42);z-index:1}
.laser{position:absolute;inset:0;z-index:1}
.laser i{position:absolute;inset:44% 0;background:var(--laser);opacity:.15;transition:opacity .12s}
.laser i+i{inset:0 44%}
.laser b{position:absolute;right:3px;top:1px;font-family:var(--f-code);font-size:calc(var(--c)*.28);color:var(--laser);font-weight:600}
.laser.on i{opacity:1;box-shadow:0 0 10px var(--laser),0 0 3px #fff}
.cell .hl{position:absolute;inset:6%;border:3px solid var(--mark);border-radius:3px;box-shadow:0 0 calc(var(--c)*.25) var(--mark);z-index:4;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.45}}
.robot{position:absolute;left:0;top:0;width:var(--c);height:var(--c);z-index:5;transition:transform var(--spd,180ms) ease-in-out}
.robot svg{width:100%;height:100%;transition:transform var(--spd,180ms) ease-in-out;filter:drop-shadow(0 0 6px rgba(255,61,139,.7))}
.robot svg .rot{transform-origin:center;transform-box:fill-box;animation:spin .25s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.robot.crash svg{animation:shake .35s}
@keyframes shake{0%,100%{translate:0}25%{translate:-8% 0}75%{translate:8% 0}}
.boom{position:absolute;width:var(--c);height:var(--c);border-radius:50%;background:radial-gradient(circle,#fff,var(--accent) 40%,transparent 70%);opacity:.85;z-index:6;animation:fade 1s forwards}
@keyframes fade{to{opacity:0}}
.tela{font-family:var(--f-code);font-size:.8rem;color:var(--code-fg);background:var(--code-bg);border:1px solid var(--line);border-radius:4px;padding:12px 14px;width:100%;max-width:100%;overflow-x:auto;line-height:1.7;white-space:pre}
.tela .lbl{display:block;font-family:var(--f-display);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cool);margin-bottom:4px;white-space:normal}
.tela .res{color:var(--ok)}
.tela .prompt{color:var(--accent)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(13,10,20,.84);z-index:10;padding:16px}
.win{background:var(--panel);border:2px solid var(--accent);border-radius:6px;padding:18px 20px;text-align:center;max-width:340px;display:flex;flex-direction:column;gap:8px;align-items:center;box-shadow:0 0 30px rgba(255,61,139,.3)}
.win b{font-family:var(--f-display);font-size:1.5rem;text-transform:uppercase;letter-spacing:.06em}
.stars{display:flex;gap:4px;font-size:2rem;line-height:1}
.stars span{color:var(--star-off)}
.stars span.on{color:var(--star)}
.win .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.out{font-family:var(--f-code);font-size:.78rem;color:var(--ink-soft);white-space:pre-wrap;max-height:90px;overflow:auto;border-top:1px dashed var(--line);padding-top:6px}
.out:empty{display:none}
.note{font-size:.86rem;color:var(--ink-soft);overflow-wrap:anywhere}
.note:empty{display:none}
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:.76rem;color:var(--ink-soft)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block;flex:none}
.engine-msg{font-size:.86rem;color:var(--ink-soft)}

/* mapa de distritos */
.levels{display:flex;flex-direction:column;gap:14px}
.world{padding:18px 20px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:4px 18px}
.world .num{grid-row:1 / span 3;font-family:var(--f-display);font-weight:800;color:var(--accent);font-size:2.4rem;line-height:1;text-shadow:0 0 16px rgba(255,61,139,.45);border-right:2px solid var(--line);padding-right:12px}
.world .num small{display:block;font-size:.66rem;letter-spacing:.16em;color:var(--ink-soft);font-weight:600;text-shadow:none;margin-bottom:4px}
.world h2{font-family:var(--f-display);margin:0;font-size:1.35rem;letter-spacing:.03em}
.world p{margin:0 0 10px;color:var(--ink-soft);font-size:.93rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;border:1.5px solid var(--line);background:var(--panel-2);border-radius:4px;padding:10px 12px;color:var(--ink)}
.tile:hover:not(:disabled){border-color:var(--ink-soft)}
.tile .n{font-family:var(--f-display);font-size:.76rem;color:var(--ink-soft);letter-spacing:.14em}
.tile b{font-size:.98rem;line-height:1.2}
.tile .s{font-size:1rem;letter-spacing:2px}
.tile .s span{color:var(--star-off)} .tile .s span.on{color:var(--star)}
.tile:disabled{opacity:.5;cursor:not-allowed}
.tile.next{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset,0 0 16px rgba(255,61,139,.25)}
.intro-card{padding:20px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.intro-card p{margin:0;max-width:68ch}
.intro-card .pre{font-size:.88rem;color:var(--ink-soft);margin-top:6px}
.loading{font-size:.8rem;color:var(--code-dim)}

@media (max-width:1020px){
  .game{grid-template-columns:minmax(0,1fr);grid-template-areas:"mission" "board" "editor"}
  .boardcard{position:static}
}
@media (max-width:600px){
  .mission{padding:16px}
  .top{gap:8px}
  .logo{font-size:1.05rem;gap:8px}
  .logo div{white-space:normal;line-height:1.05}
  .logo svg{width:34px;height:34px}
  .logo small{display:none}
  .pill{padding:5px 9px}
  .top .btn{padding:8px 12px}
  #code,.gutter{font-size:15px}
  .actions .btn{flex:1}
  .speed{margin-left:0;width:100%}
  .speed button{flex:1}
  .world{grid-template-columns:minmax(0,1fr)}
  .world .num{grid-row:auto;border-right:0;padding-right:0;font-size:1.6rem;display:flex;align-items:baseline;gap:8px}
  .stage{min-height:260px}
  .overlay{overflow:auto;padding:10px}
  .win{padding:12px 14px;gap:6px}
  .win b{font-size:1.2rem}
  .stars{font-size:1.6rem}
}
@media (pointer:fine) and (min-width:1021px){.keys{display:none}}
@media (prefers-reduced-motion:reduce){.robot,.robot svg,.chip{transition:none}.robot.crash svg,.cell .hl,.robot svg .rot{animation:none}}
</style>
</head>
<body>


<header class="top">
  <div class="logo"><svg viewBox="0 0 42 42" aria-hidden="true"><rect x="1" y="1" width="40" height="40" rx="4" fill="#161124" stroke="#ff3d8b" stroke-width="2"/><g fill="#241c3a" stroke="#3a2e5c"><rect x="5" y="16" width="8" height="21"/><rect x="15" y="8" width="9" height="29"/><rect x="26" y="20" width="10" height="17"/></g><g fill="#ffd23f" opacity=".8"><rect x="17" y="12" width="2" height="2"/><rect x="21" y="16" width="2" height="2"/><rect x="7" y="20" width="2" height="2"/><rect x="29" y="24" width="2" height="2"/></g><path d="M5 30 L37 30" stroke="#33e1ff" stroke-width="1.5" opacity=".7"/><circle cx="32" cy="10" r="3" fill="#ff3d8b"/></svg><div><span class="n">Protocolo</span> Neon<small>Python avançado</small></div></div>
  <div class="top-r">
    <span class="pill" title="Estrelas conquistadas"><span class="st">★</span><span id="starCount">0</span></span>
    <button class="btn" id="levelsBtn">Missões</button>
  </div>
</header>

<main class="wrap" id="view"></main>

<template id="gameTpl">
  <div class="game">
    <section class="card mission" id="mission"></section>
    <section class="card boardcard" aria-label="Câmera aérea">
      <div class="bhead"><span id="bstatus"></span><div class="maps" id="maps"></div></div>
      <div class="stage" id="stage"><div class="board" id="board"></div></div>
      <div class="note" id="note"></div>
      <div class="legend" id="legend"></div>
      <div class="out" id="out"></div>
    </section>
    <section class="edcol">
      <div class="editor">
        <div class="ed-head"><span>vespa.py</span><span id="engine" class="loading">carregando Python…</span></div>
        <div class="ed-body"><div class="gutter" id="gutter">1</div><textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" aria-label="Editor de código Python"></textarea></div>
        <div class="keys" id="keys" aria-label="Símbolos"></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="run">▶ Executar invasão</button>
        <button class="btn" id="stop" hidden>■ Abortar</button>
        <button class="btn ghost" id="reset">Recomeçar código</button>
        <div class="speed" role="group" aria-label="Velocidade">
          <button data-speed="380">Lento</button><button data-speed="160">Normal</button><button data-speed="50">Rápido</button>
        </div>
      </div>

<script>
const DADOS = {"distritos": [{"titulo": "Mercado Baixo", "ideia": "Funções de primeira classe: closures, decoradores e decoradores com argumentos."}, {"titulo": "Torres Corporativas", "ideia": "O modelo de dados do Python: operadores, containers e gerenciadores de contexto."}, {"titulo": "Subsolo", "ideia": "Iteradores, geradores preguiçosos e corrotinas com send()."}, {"titulo": "Laboratório Kessler", "ideia": "Metaprogramação: descritores, registro automático de subclasses e proxies."}, {"titulo": "Distrito Neon", "ideia": "Texto: expressões regulares, dataclasses e interpretadores."}, {"titulo": "Núcleo", "ideia": "Algoritmos: Dijkstra, programação dinâmica com bitmask e busca no tempo."}], "missoes": [{"id": "n1", "distrito": 0, "titulo": "Limitador de tentativas", "intro": "<p>O firewall do Mercado Baixo bloqueia quem tenta senhas rápido demais. Para não disparar o alarme, a VESPA precisa de um <b>limitador<\/b>: no máximo <code>maximo<\/code> tentativas aceitas em qualquer janela de <code>janela<\/code> instantes.<\/p>\n<p>A ferramenta certa é a <b>closure<\/b>: uma função criada dentro de outra, que continua enxergando as variáveis de quem a criou. Duas closures criadas juntas compartilham o mesmo estado; para <i>reatribuir<\/i> uma variável de fora, use <code>nonlocal<\/code>.<\/p>\n<pre>def criar_contador():\n    total = 0\n    def contar():\n        nonlocal total\n        total += 1\n        return total\n    return contar<\/pre>", "task": "Escreva <code>criar_limitador(maximo, janela)<\/code> que devolve a tupla <code>(tentar, bloqueadas)<\/code>. <code>tentar(t)<\/code> recebe o instante (nunca diminui) e devolve <code>True<\/code> se, contando só as tentativas <b>aceitas<\/b> nos instantes de <code>t - janela + 1<\/code> até <code>t<\/code>, houver menos de <code>maximo<\/code> (e então registra esta); senão devolve <code>False<\/code>. <code>bloqueadas()<\/code> diz quantas foram recusadas até agora.", "starter": "from collections import deque\n\ndef criar_limitador(maximo, janela):\n    aceitas = deque()\n    recusadas = 0\n\n    def tentar(t):\n        return True\n\n    def bloqueadas():\n        return recusadas\n\n    return tentar, bloqueadas\n", "solution": "from collections import deque\n\ndef criar_limitador(maximo, janela):\n    aceitas = deque()\n    recusadas = 0\n\n    def tentar(t):\n        nonlocal recusadas\n        while aceitas and aceitas[0] <= t - janela:\n            aceitas.popleft()\n        if len(aceitas) < maximo:\n            aceitas.append(t)\n            return True\n        recusadas += 1\n        return False\n\n    def bloqueadas():\n        return recusadas\n\n    return tentar, bloqueadas\n", "hint": "Em tentar: primeiro descarte do começo da deque os instantes que já saíram da janela (aceitas[0] <= t - janela). Depois, se len(aceitas) < maximo, guarde t e devolva True. Senão, some 1 em recusadas (precisa de nonlocal recusadas, porque é uma reatribuição) e devolva False. A deque não precisa de nonlocal: você só chama métodos nela.", "forbid": [["\\bglobal\\b", "Nada de global: o estado precisa ficar dentro da closure, para cada limitador ter o seu."]], "extras": ""}, {"id": "n2", "distrito": 0, "titulo": "Decorador espião", "intro": "<p>Para entender um sistema invadido, a equipe quer registrar cada chamada de função: nome, argumentos e o que voltou. Um <b>decorador<\/b> faz isso sem tocar no código original: ele recebe a função e devolve outra, o <i>envelope<\/i>, que faz algo antes e depois de chamar a original.<\/p>\n<pre>def decorador(func):\n    @functools.wraps(func)          # copia __name__ e __doc__ da original\n    def envelope(*args, **kwargs):\n        ...                         # antes\n        resultado = func(*args, **kwargs)\n        ...                         # depois\n        return resultado\n    return envelope<\/pre>\n<p>Sem <code>functools.wraps<\/code>, a função decorada passaria a se chamar <code>envelope<\/code>, o que confunde logs e ferramentas.<\/p>", "task": "Crie a lista <code>REGISTRO = []<\/code> e o decorador <code>registrar<\/code>. Cada chamada acrescenta a tupla <code>(nome, args, kwargs, resultado)<\/code>. Se a função lançar uma exceção, registre <code>\"erro: NomeDaExcecao\"<\/code> no lugar do resultado e deixe a exceção <b>subir<\/b> de novo. A função decorada mantém nome e documentação.", "starter": "import functools\n\nREGISTRO = []\n\ndef registrar(func):\n    def envelope(*args, **kwargs):\n        return func(*args, **kwargs)\n    return envelope\n", "solution": "import functools\n\nREGISTRO = []\n\ndef registrar(func):\n    @functools.wraps(func)\n    def envelope(*args, **kwargs):\n        try:\n            resultado = func(*args, **kwargs)\n        except Exception as erro:\n            REGISTRO.append((func.__name__, args, kwargs, f\"erro: {type(erro).__name__}\"))\n            raise\n        REGISTRO.append((func.__name__, args, kwargs, resultado))\n        return resultado\n    return envelope\n", "hint": "Coloque @functools.wraps(func) em cima do envelope. Chame func dentro de try. No except Exception as erro: registre f\"erro: {type(erro).__name__}\" e use raise sozinho (relança a mesma exceção). Fora do try, registre o resultado e devolva-o.", "extras": ""}, {"id": "n3", "distrito": 0, "titulo": "Insistência controlada", "intro": "<p>As fechaduras eletrônicas do mercado falham de vez em quando com <code>ConexaoInstavel<\/code>. Vale tentar de novo, mas só algumas vezes e só para os erros certos: um <code>Firewall<\/code> significa que fomos descobertos e é melhor parar na hora.<\/p>\n<p>Um decorador <b>com argumentos<\/b> tem três camadas: a fábrica recebe os parâmetros e devolve o decorador, que recebe a função e devolve o envelope.<\/p>\n<pre>@tentativas(3, ConexaoInstavel)\ndef abrir_porta(codigo): ...\n\n# é o mesmo que:\nabrir_porta = tentativas(3, ConexaoInstavel)(abrir_porta)<\/pre>\n<p>Dica de sintaxe: <code>except excecoes:<\/code> aceita uma <b>tupla<\/b> de classes de exceção. As classes <code>ConexaoInstavel<\/code> e <code>Firewall<\/code> já vêm da estação.<\/p>", "task": "Escreva <code>tentativas(n, *excecoes)<\/code>. A função decorada é chamada até <code>n<\/code> vezes enquanto lançar uma das <code>excecoes<\/code>; na primeira vez que der certo, devolve o resultado. Se todas as <code>n<\/code> falharem, a última exceção sobe. Exceções que não estão na lista sobem na hora, sem nova tentativa. Use <code>functools.wraps<\/code>.", "starter": "import functools\n\ndef tentativas(n, *excecoes):\n    def decorador(func):\n        def envelope(*args, **kwargs):\n            return func(*args, **kwargs)\n        return envelope\n    return decorador\n", "solution": "import functools\n\ndef tentativas(n, *excecoes):\n    def decorador(func):\n        @functools.wraps(func)\n        def envelope(*args, **kwargs):\n            for tentativa in range(n):\n                try:\n                    return func(*args, **kwargs)\n                except excecoes:\n                    if tentativa == n - 1:\n                        raise\n        return envelope\n    return decorador\n", "hint": "Dentro do envelope, um for de n voltas com try: return func(...). No except excecoes: (a tupla recebida em *excecoes), se for a última volta, use raise para deixar a exceção subir; senão, deixe o laço continuar. Exceções que não estão na tupla nem são capturadas, então sobem sozinhas.", "extras": "class ConexaoInstavel(Exception):\n    pass\n\nclass Firewall(Exception):\n    pass"}, {"id": "n4", "distrito": 1, "titulo": "Vetores de voo", "intro": "<p>O piloto automático da VESPA calcula posições somando deslocamentos. Em vez de mexer com pares soltos, vamos criar um tipo <code>Vetor<\/code> que se comporta como número: dá para somar, subtrair, multiplicar por um inteiro, comparar e usar como chave de dicionário.<\/p>\n<p>Isso é o <b>modelo de dados<\/b> do Python: métodos especiais que os operadores chamam por baixo.<\/p>\n<pre>a + b      →  a.__add__(b)        a * 3   →  a.__mul__(3)\n3 * a      →  a.__rmul__(3)       -a      →  a.__neg__()\nabs(a)     →  a.__abs__()         a == b  →  a.__eq__(b)\n{a}        →  usa a.__hash__()    l, c = a  →  a.__iter__()\nif a:      →  a.__bool__()        repr(a) →  a.__repr__()<\/pre>\n<p>Regra de ouro: se definir <code>__eq__<\/code>, defina <code>__hash__<\/code> combinando os mesmos campos (por exemplo, <code>hash((self.l, self.c))<\/code>).<\/p>", "task": "Crie <code>Vetor(l, c)<\/code> (linha e coluna) com <code>+<\/code>, <code>-<\/code>, <code>*<\/code> por inteiro dos dois lados, <code>-v<\/code>, <code>abs(v)<\/code> (distância de Manhattan: <code>|l| + |c|<\/code>), <code>==<\/code>, <code>hash<\/code>, desempacotamento, <code>bool<\/code> (falso só para <code>Vetor(0, 0)<\/code>) e <code>repr<\/code> no formato <code>Vetor(2, -3)<\/code>. O piloto automático vai usar a sua classe para seguir o plano de voo.", "starter": "class Vetor:\n    def __init__(self, l, c):\n        self.l = l\n        self.c = c\n\n    def __repr__(self):\n        return f\"Vetor({self.l}, {self.c})\"\n", "solution": "class Vetor:\n    def __init__(self, l, c):\n        self.l = l\n        self.c = c\n\n    def __repr__(self):\n        return f\"Vetor({self.l}, {self.c})\"\n\n    def __add__(self, outro):\n        return Vetor(self.l + outro.l, self.c + outro.c)\n\n    def __sub__(self, outro):\n        return Vetor(self.l - outro.l, self.c - outro.c)\n\n    def __mul__(self, k):\n        return Vetor(self.l * k, self.c * k)\n\n    __rmul__ = __mul__\n\n    def __neg__(self):\n        return Vetor(-self.l, -self.c)\n\n    def __abs__(self):\n        return abs(self.l) + abs(self.c)\n\n    def __eq__(self, outro):\n        return isinstance(outro, Vetor) and (self.l, self.c) == (outro.l, outro.c)\n\n    def __hash__(self):\n        return hash((self.l, self.c))\n\n    def __iter__(self):\n        yield self.l\n        yield self.c\n\n    def __bool__(self):\n        return bool(self.l or self.c)\n", "hint": "Cada operador devolve um Vetor NOVO (não altere self). __rmul__ pode ser o mesmo método que __mul__ (__rmul__ = __mul__). __iter__ pode ser um gerador: yield self.l e depois yield self.c. Em __eq__, compare as tuplas (self.l, self.c) e (outro.l, outro.c); em __hash__, devolva hash dessa tupla.", "extras": ""}, {"id": "n5", "distrito": 1, "titulo": "A grade da cidade", "intro": "<p>Os mapas das torres chegam como listas de strings, e todo mundo erra os limites: em Python, <code>linhas[-1]<\/code> não dá erro, pega a <b>última<\/b> linha. A VESPA já bateu num prédio por causa disso.<\/p>\n<p>Vamos encapsular o mapa num <b>container<\/b> próprio. Com os métodos especiais certos, ele funciona com a sintaxe nativa:<\/p>\n<pre>grade[2, 5]          →  grade.__getitem__((2, 5))\ngrade[2, 5] = \"x\"    →  grade.__setitem__((2, 5), \"x\")\n(2, 5) in grade      →  grade.__contains__((2, 5))\nlen(grade)           →  grade.__len__()\nfor pos, casa in grade:  →  grade.__iter__()<\/pre>\n<p>Note que <code>grade[2, 5]<\/code> passa <b>uma tupla<\/b> para <code>__getitem__<\/code>.<\/p>", "task": "Crie <code>Grade(linhas)<\/code> com: <code>grade[l, c]<\/code> devolvendo a casa, ou <code>\"#\"<\/code> se estiver fora do mapa (inclusive índices negativos); <code>grade[l, c] = valor<\/code>; <code>(l, c) in grade<\/code> (está dentro dos limites?); <code>len(grade)<\/code> (casas que não são <code>\"#\"<\/code>); iteração em ordem de leitura com pares <code>((l, c), casa)<\/code>; e o método <code>vizinhos(pos)<\/code> que gera as posições livres ao redor. A estação usa a sua Grade para traçar a rota.", "starter": "class Grade:\n    def __init__(self, linhas):\n        self.casas = [list(linha) for linha in linhas]\n\n    def __contains__(self, pos):\n        l, c = pos\n        return False\n\n    def __getitem__(self, pos):\n        return \"#\"\n", "solution": "class Grade:\n    def __init__(self, linhas):\n        self.casas = [list(linha) for linha in linhas]\n\n    def __contains__(self, pos):\n        l, c = pos\n        return 0 <= l < len(self.casas) and 0 <= c < len(self.casas[0])\n\n    def __getitem__(self, pos):\n        if pos not in self:\n            return \"#\"\n        l, c = pos\n        return self.casas[l][c]\n\n    def __setitem__(self, pos, valor):\n        l, c = pos\n        self.casas[l][c] = valor\n\n    def __len__(self):\n        return sum(casa != \"#\" for linha in self.casas for casa in linha)\n\n    def __iter__(self):\n        for l, linha in enumerate(self.casas):\n            for c, casa in enumerate(linha):\n                yield (l, c), casa\n\n    def vizinhos(self, pos):\n        l, c = pos\n        for dl, dc in ((-1, 0), (1, 0), (0, -1), (0, 1)):\n            if self[l + dl, c + dc] != \"#\":\n                yield (l + dl, c + dc)\n", "hint": "Faça __contains__ checar 0 <= l < número de linhas e 0 <= c < largura. Aí __getitem__ fica simples: se pos not in self, devolva \"#\". __iter__ e vizinhos podem ser geradores (yield). Em vizinhos, use o próprio self[l + dl, c + dc] para ler as casas: os limites já estão resolvidos.", "extras": ""}, {"id": "n6", "distrito": 1, "titulo": "Camuflagem óptica", "intro": "<p>Para passar pelas câmeras das torres, a VESPA liga a camuflagem. O problema: se algo der errado no meio do caminho, ela precisa <b>sempre<\/b> desligar a camuflagem ao sair (a bateria agradece). Esse padrão \"prepara, executa, sempre limpa\" é o <b>gerenciador de contexto<\/b>, usado com <code>with<\/code>.<\/p>\n<pre>with camuflagem(vespa) as d:   # chama __enter__; o retorno vai para d\n    ...                         # ao sair (normal ou com erro), chama __exit__\n\ndef __exit__(self, tipo, valor, rastro):\n    # tipo é a classe da exceção (ou None se não houve)\n    return True     # True = a exceção foi tratada e NÃO sobe<\/pre>\n<p>As classes <code>Drone<\/code> (com <code>visivel<\/code> e <code>alertas<\/code>) e <code>Detectado<\/code> já vêm da estação. Também dá para fazer com <code>@contextlib.contextmanager<\/code> e um <code>yield<\/code> dentro de <code>try/except/finally<\/code>; escolha o jeito que preferir.<\/p>", "task": "Crie <code>camuflagem(drone)<\/code>, para usar com <code>with<\/code>: ao entrar, <code>drone.visivel = False<\/code> e o próprio drone é entregue no <code>as<\/code>; ao sair, <code>drone.visivel = True<\/code> sempre. Se a exceção for <code>Detectado<\/code>, ela é abafada e <code>drone.alertas<\/code> aumenta 1; qualquer outra exceção sobe normalmente.", "starter": "class camuflagem:\n    def __init__(self, drone):\n        self.drone = drone\n\n    def __enter__(self):\n        return self.drone\n\n    def __exit__(self, tipo, valor, rastro):\n        return False\n", "solution": "class camuflagem:\n    def __init__(self, drone):\n        self.drone = drone\n\n    def __enter__(self):\n        self.drone.visivel = False\n        return self.drone\n\n    def __exit__(self, tipo, valor, rastro):\n        self.drone.visivel = True\n        if tipo is not None and issubclass(tipo, Detectado):\n            self.drone.alertas += 1\n            return True\n        return False\n", "hint": "No __enter__, desligue a visibilidade e devolva self.drone. No __exit__, ligue a visibilidade de volta antes de qualquer outra coisa. Depois: se tipo não for None e issubclass(tipo, Detectado), some 1 nos alertas e devolva True; senão devolva False (a exceção, se houver, continua subindo).", "extras": "class Detectado(Exception):\n    pass\n\nclass Drone:\n    def __init__(self, nome):\n        self.nome = nome\n        self.visivel = True\n        self.alertas = 0"}, {"id": "n7", "distrito": 2, "titulo": "Varredura em zigue-zague", "intro": "<p>Nos galpões do subsolo, a VESPA varre o teto em <b>zigue-zague<\/b>: a linha 0 da esquerda para a direita, a linha 1 da direita para a esquerda, e assim por diante. Assim ela nunca precisa voltar sem varrer.<\/p>\n<p>Desta vez, nada de gerador: escreva um <b>iterador<\/b> de verdade, uma classe com o protocolo completo.<\/p>\n<pre>it = Varredura(2, 3)\niter(it) is it     # __iter__ devolve o próprio objeto\nnext(it)           # __next__ → (0, 0), depois (0, 1), (0, 2), (1, 2), (1, 1), (1, 0)\nnext(it)           # sem mais casas: raise StopIteration<\/pre>\n<p>As posições são relativas ao galpão: <code>(0, 0)<\/code> é o canto de cima à esquerda.<\/p>", "task": "Crie a classe <code>Varredura(altura, largura)<\/code> com <code>__iter__<\/code>, <code>__next__<\/code> (lança <code>StopIteration<\/code> no fim) e <code>__len__<\/code> (total de casas). A VESPA seguirá as posições em ordem e recolherá os chips do caminho.", "starter": "class Varredura:\n    def __init__(self, altura, largura):\n        self.altura = altura\n        self.largura = largura\n        self.k = 0          # quantas posições já foram entregues\n\n    def __iter__(self):\n        return self\n\n    def __next__(self):\n        raise StopIteration\n", "solution": "class Varredura:\n    def __init__(self, altura, largura):\n        self.altura = altura\n        self.largura = largura\n        self.k = 0\n\n    def __iter__(self):\n        return self\n\n    def __len__(self):\n        return self.altura * self.largura\n\n    def __next__(self):\n        if self.k >= len(self):\n            raise StopIteration\n        l, c = divmod(self.k, self.largura)\n        self.k += 1\n        if l % 2 == 1:\n            c = self.largura - 1 - c\n        return (l, c)\n", "hint": "Guarde um contador k. Em __next__: se k chegou a altura * largura, raise StopIteration. Senão, divmod(k, largura) dá (linha, coluna) na ordem normal; nas linhas ímpares inverta a coluna (largura - 1 - c). Some 1 em k antes de devolver.", "extras": ""}, {"id": "n8", "distrito": 2, "titulo": "Pipeline de pacotes", "intro": "<p>O tráfego da rede do subsolo nunca para: os logs chegam como um fluxo <b>infinito<\/b> de linhas. Ler tudo para uma lista não é uma opção. A saída é montar um <b>pipeline de geradores<\/b>: cada etapa pede um item à anterior só quando precisa.<\/p>\n<pre>02:15 SRV-2 ERRO porta 22 recusou conexão\nhora  servidor nível mensagem (o resto da linha)\n\n\"a b c d e\".split(maxsplit=3)   # ['a', 'b', 'c', 'd e']\n(x for x in itens if cond)      # expressão geradora: também é preguiçosa<\/pre>\n<p>Linhas vazias e linhas que começam com <code>#<\/code> são comentários e devem ser puladas. A estação vai testar com <code>itertools.cycle<\/code>, que repete as linhas para sempre: se alguma etapa tentar ler tudo, o código trava.<\/p>", "task": "Escreva o gerador <code>eventos(linhas)<\/code>, que entrega tuplas <code>(hora, servidor, nivel, mensagem)<\/code>, e o gerador <code>alertas(linhas, servidor=None)<\/code>, que usa <code>eventos<\/code> e entrega só os de nível <code>\"ERRO\"<\/code> (e só do servidor pedido, se houver).", "starter": "def eventos(linhas):\n    for linha in linhas:\n        pass\n\n\ndef alertas(linhas, servidor=None):\n    pass\n", "solution": "def eventos(linhas):\n    for linha in linhas:\n        linha = linha.strip()\n        if linha and not linha.startswith(\"#\"):\n            yield tuple(linha.split(maxsplit=3))\n\n\ndef alertas(linhas, servidor=None):\n    for evento in eventos(linhas):\n        if evento[2] == \"ERRO\" and servidor in (None, evento[1]):\n            yield evento\n", "hint": "Em eventos: strip na linha; se sobrar algo e não começar com \"#\", yield tuple(linha.split(maxsplit=3)). Em alertas: percorra eventos(linhas) e faça yield só dos que têm nível \"ERRO\" e servidor compatível. Nunca use list(...) nem len(...) no fluxo.", "extras": ""}, {"id": "n9", "distrito": 2, "titulo": "Corrotina de vigilância", "intro": "<p>Os sensores de temperatura dos servidores mandam leituras uma a uma. A VESPA precisa de um monitor que <b>receba<\/b> cada leitura e <b>responda<\/b> com o estado, guardando a memória entre uma leitura e outra.<\/p>\n<p>Um gerador também pode receber valores: <code>x = yield valor<\/code> entrega <code>valor<\/code> e pausa; quando alguém chamar <code>.send(dado)<\/code>, o gerador continua com <code>x = dado<\/code>. Isso se chama <b>corrotina<\/b>.<\/p>\n<pre>m = monitor(50, 3)\nnext(m)        # \"liga\" a corrotina até o primeiro yield (devolve None)\nm.send(40)     # → \"OK\"\nm.send(70)     # média de [40, 70] = 55 > 50 → \"ALERTA\"<\/pre>", "task": "Escreva a corrotina <code>monitor(limite, janela)<\/code>: o primeiro <code>next<\/code> devolve <code>None<\/code>; cada <code>send(leitura)<\/code> devolve <code>\"ALERTA\"<\/code> se a média das últimas <code>janela<\/code> leituras (ou de todas, se ainda houver menos) for <b>maior<\/b> que <code>limite<\/code>, e <code>\"OK\"<\/code> caso contrário.", "starter": "from collections import deque\n\ndef monitor(limite, janela):\n    ultimas = deque(maxlen=janela)\n    estado = None\n    while True:\n        leitura = yield estado\n", "solution": "from collections import deque\n\ndef monitor(limite, janela):\n    ultimas = deque(maxlen=janela)\n    estado = None\n    while True:\n        leitura = yield estado\n        ultimas.append(leitura)\n        media = sum(ultimas) / len(ultimas)\n        estado = \"ALERTA\" if media > limite else \"OK\"\n", "hint": "Uma deque(maxlen=janela) descarta sozinha as leituras antigas. Depois de leitura = yield estado, acrescente a leitura, calcule a média e atualize estado: o próximo yield (na volta seguinte do while) entrega esse estado para quem chamou send.", "extras": ""}, {"id": "n10", "distrito": 3, "titulo": "Implantes calibrados", "intro": "<p>No Laboratório Kessler, implantes cibernéticos fora da faixa segura queimam o usuário. Cada atributo precisa ser validado em toda atribuição, e escrever um <code>@property<\/code> para cada um seria repetitivo.<\/p>\n<p>Um <b>descritor<\/b> resolve de uma vez: é um objeto colocado como atributo de classe que intercepta leitura e escrita daquele atributo em todas as instâncias.<\/p>\n<pre>class Implante:\n    potencia = Faixa(0, 100)      # o descritor\ni.potencia = 80   →  Faixa.__set__(descritor, i, 80)\ni.potencia        →  Faixa.__get__(descritor, i, Implante)\nImplante.potencia →  Faixa.__get__(descritor, None, Implante)\n# ao criar a classe: Faixa.__set_name__(descritor, Implante, \"potencia\")<\/pre>\n<p>Cuidado: o descritor é <b>um só<\/b> para todas as instâncias. Guarde o valor no objeto (<code>obj.__dict__[nome]<\/code>), não em <code>self<\/code>.<\/p>", "task": "Crie o descritor <code>Faixa(minimo, maximo)<\/code>: valores dentro da faixa (limites incluídos) são guardados no objeto; fora dela, lance <code>ValueError(\"potencia fora da faixa: 120\")<\/code> com o nome do atributo e o valor. Lido pela classe, devolve o próprio descritor. A estação cria a classe <code>Implante<\/code> com os seus descritores.", "starter": "class Faixa:\n    def __init__(self, minimo, maximo):\n        self.minimo = minimo\n        self.maximo = maximo\n\n    def __set_name__(self, dono, nome):\n        self.nome = nome\n", "solution": "class Faixa:\n    def __init__(self, minimo, maximo):\n        self.minimo = minimo\n        self.maximo = maximo\n\n    def __set_name__(self, dono, nome):\n        self.nome = nome\n\n    def __get__(self, obj, tipo=None):\n        if obj is None:\n            return self\n        return obj.__dict__[self.nome]\n\n    def __set__(self, obj, valor):\n        if not self.minimo <= valor <= self.maximo:\n            raise ValueError(f\"{self.nome} fora da faixa: {valor}\")\n        obj.__dict__[self.nome] = valor\n", "hint": "__set_name__ guarda o nome do atributo. Em __set__, valide com self.minimo <= valor <= self.maximo e guarde em obj.__dict__[self.nome]. Em __get__, se obj for None (acesso pela classe) devolva self; senão devolva obj.__dict__[self.nome]. Como o descritor tem __set__, ele tem prioridade sobre o __dict__ da instância, então não há conflito de nomes.", "extras": "# a estação cria a classe abaixo DEPOIS do seu código:\nclass Implante:\n    potencia = Faixa(0, 100)\n    temperatura = Faixa(-20, 60)\n\n    def __init__(self, potencia, temperatura):\n        self.potencia = potencia\n        self.temperatura = temperatura"}, {"id": "n11", "distrito": 3, "titulo": "Registro de programas", "intro": "<p>A VESPA aceita scripts de texto, uma instrução por linha: <code>AVANCAR 3<\/code>, <code>GIRAR D<\/code>. Cada comando é uma classe. O desafio é que a equipe vive criando comandos novos, e ninguém quer editar uma lista central toda vez.<\/p>\n<p>Com <code>__init_subclass__<\/code>, a classe base é avisada sempre que alguém cria uma subclasse dela, e pode registrá-la sozinha:<\/p>\n<pre>class Base:\n    def __init_subclass__(cls, **kwargs):\n        super().__init_subclass__(**kwargs)\n        print(\"nova subclasse:\", cls.__name__)\n\nclass Filha(Base):     # imprime \"nova subclasse: Filha\"\n    pass<\/pre>\n<p>O drone recebido por <code>executar<\/code> tem <code>drone.avancar()<\/code> (uma casa à frente) e <code>drone.girar(\"D\")<\/code> / <code>drone.girar(\"E\")<\/code>. Ele começa virado para leste. A estação vai criar o comando <code>RECUAR<\/code> por conta própria para ver se o seu registro aceita extensões.<\/p>", "task": "Crie <code>ComandoDesconhecido(Exception)<\/code>, a base <code>Programa<\/code> com <code>registro = {}<\/code> preenchido automaticamente pelo atributo <code>comando<\/code> de cada subclasse, as subclasses <code>AVANCAR n<\/code> e <code>GIRAR D|E<\/code>, e <code>rodar_script(script, drone)<\/code>, que executa linha a linha e lança <code>ComandoDesconhecido(nome)<\/code> para comandos fora do registro.", "starter": "class ComandoDesconhecido(Exception):\n    pass\n\n\nclass Programa:\n    registro = {}\n\n    def executar(self, drone, argumento):\n        raise NotImplementedError\n\n\ndef rodar_script(script, drone):\n    for linha in script.splitlines():\n        nome, _, argumento = linha.partition(\" \")\n", "solution": "class ComandoDesconhecido(Exception):\n    pass\n\n\nclass Programa:\n    registro = {}\n\n    def __init_subclass__(cls, **kwargs):\n        super().__init_subclass__(**kwargs)\n        Programa.registro[cls.comando] = cls\n\n    def executar(self, drone, argumento):\n        raise NotImplementedError\n\n\nclass Avancar(Programa):\n    comando = \"AVANCAR\"\n\n    def executar(self, drone, argumento):\n        for _ in range(int(argumento)):\n            drone.avancar()\n\n\nclass Girar(Programa):\n    comando = \"GIRAR\"\n\n    def executar(self, drone, argumento):\n        drone.girar(argumento)\n\n\ndef rodar_script(script, drone):\n    for linha in script.splitlines():\n        nome, _, argumento = linha.partition(\" \")\n        if nome not in Programa.registro:\n            raise ComandoDesconhecido(nome)\n        Programa.registro[nome]().executar(drone, argumento)\n", "hint": "Em __init_subclass__(cls, **kwargs): chame super().__init_subclass__(**kwargs) e faça Programa.registro[cls.comando] = cls. Cada subclasse só precisa de comando = \"...\" e do método executar. Em rodar_script, procure o nome no registro, crie uma instância (Programa.registro[nome]()) e chame executar(drone, argumento).", "extras": ""}, {"id": "n12", "distrito": 3, "titulo": "Espião transparente", "intro": "<p>Precisamos espionar um servidor do laboratório sem que ele perceba. A ideia é um <b>proxy<\/b>: um objeto que se passa pelo servidor, repassa tudo, e anota cada acesso no caminho.<\/p>\n<p>O gancho é <code>__getattr__<\/code>: o Python só o chama quando o atributo <b>não<\/b> é encontrado do jeito normal. Os atributos próprios do espião (como <code>log<\/code>) são achados normalmente; todo o resto cai no <code>__getattr__<\/code> e pode ser repassado ao alvo.<\/p>\n<pre>valor = getattr(self._alvo, nome)   # pega o atributo do alvo\ncallable(valor)                     # é um método?\ndef espiado(*args, **kwargs): ...   # envelope criado na hora (closure)<\/pre>\n<p>A classe <code>Servidor<\/code> já vem da estação.<\/p>", "task": "Crie <code>Espiao(alvo)<\/code> com <code>self.log = []<\/code>. Leitura de atributo comum: registre <code>(nome, None)<\/code> e devolva o valor atual do alvo. Método: devolva uma função que registra <code>(nome, args)<\/code> (só os posicionais) e chama o método original com todos os argumentos. Nomes que começam com <code>_segredo<\/code>: lance <code>PermissionError(\"acesso negado: _segredo_root\")<\/code> sem registrar. Atributos inexistentes dão <code>AttributeError<\/code> normalmente.", "starter": "class Espiao:\n    def __init__(self, alvo):\n        self._alvo = alvo\n        self.log = []\n\n    def __getattr__(self, nome):\n        return getattr(self._alvo, nome)\n", "solution": "class Espiao:\n    def __init__(self, alvo):\n        self._alvo = alvo\n        self.log = []\n\n    def __getattr__(self, nome):\n        if nome.startswith(\"_segredo\"):\n            raise PermissionError(f\"acesso negado: {nome}\")\n        valor = getattr(self._alvo, nome)\n        if callable(valor):\n            def espiado(*args, **kwargs):\n                self.log.append((nome, args))\n                return valor(*args, **kwargs)\n            return espiado\n        self.log.append((nome, None))\n        return valor\n", "hint": "Comece checando o prefixo _segredo e lançando PermissionError. Depois valor = getattr(self._alvo, nome): se o atributo não existir, isso já lança AttributeError sozinho. Se callable(valor), crie e devolva uma função interna que registra (nome, args) e chama valor(*args, **kwargs). Senão, registre (nome, None) e devolva valor.", "extras": "class Servidor:\n    def __init__(self, nome):\n        self.nome = nome\n        self.versao = \"4.2\"\n        self._segredo_root = \"hunter2\"\n        self.arquivos = [\"planos.txt\", \"folha.csv\"]\n\n    def listar(self, pasta=\"/\"):\n        return [pasta + a for a in self.arquivos]\n\n    def baixar(self, arquivo, rapido=False):\n        return f\"{arquivo} baixado\""}, {"id": "n13", "distrito": 4, "titulo": "Rastro de acessos", "intro": "<p>Alguém está tentando entrar no Distrito Neon na força bruta. O log de acessos tem este formato:<\/p>\n<pre>[23:41:07] 10.0.3.17 kira LOGIN_FALHOU<\/pre>\n<p>Hora sempre com dois dígitos em cada parte, IP com quatro grupos de dígitos separados por ponto, usuário com letras, dígitos ou <code>_<\/code>, e o evento <code>LOGIN_OK<\/code> ou <code>LOGIN_FALHOU<\/code>. Linhas fora desse formato (ruído, linhas cortadas, eventos estranhos, texto sobrando) devem ser <b>ignoradas<\/b>. Espaços nas pontas da linha não contam.<\/p>\n<pre>PADRAO = re.compile(r\"\\[(\\d\\d):(\\d\\d):(\\d\\d)\\] ...\")\nm = PADRAO.fullmatch(linha)       # a linha INTEIRA precisa casar\nm.groups()                         # os grupos entre parênteses\n\n@dataclass(frozen=True)            # gera __init__, __repr__, __eq__ e trava alterações\nclass Ponto:\n    x: int\n    y: int<\/pre>", "task": "Crie a dataclass imutável <code>Acesso<\/code> com os campos <code>hora<\/code> (segundos desde a meia-noite), <code>ip<\/code>, <code>usuario<\/code> e <code>sucesso<\/code> (bool), nessa ordem. Escreva <code>ler_acessos(texto)<\/code>, que devolve a lista de <code>Acesso<\/code> das linhas válidas, e <code>suspeitos(acessos, limite)<\/code>, que devolve o <b>conjunto<\/b> de IPs com pelo menos <code>limite<\/code> falhas.", "starter": "import re\nfrom collections import Counter\nfrom dataclasses import dataclass\n\nPADRAO = re.compile(r\"\")\n\n\ndef ler_acessos(texto):\n    acessos = []\n    for linha in texto.splitlines():\n        pass\n    return acessos\n", "solution": "import re\nfrom collections import Counter\nfrom dataclasses import dataclass\n\nPADRAO = re.compile(r\"\\[(\\d\\d):(\\d\\d):(\\d\\d)\\] (\\d+\\.\\d+\\.\\d+\\.\\d+) (\\w+) (LOGIN_OK|LOGIN_FALHOU)\")\n\n\n@dataclass(frozen=True)\nclass Acesso:\n    hora: int\n    ip: str\n    usuario: str\n    sucesso: bool\n\n\ndef ler_acessos(texto):\n    acessos = []\n    for linha in texto.splitlines():\n        m = PADRAO.fullmatch(linha.strip())\n        if m:\n            h, mi, s, ip, usuario, evento = m.groups()\n            hora = int(h) * 3600 + int(mi) * 60 + int(s)\n            acessos.append(Acesso(hora, ip, usuario, evento == \"LOGIN_OK\"))\n    return acessos\n\n\ndef suspeitos(acessos, limite):\n    falhas = Counter(a.ip for a in acessos if not a.sucesso)\n    return {ip for ip, n in falhas.items() if n >= limite}\n", "hint": "O padrão pode ser r\"\\[(\\d\\d):(\\d\\d):(\\d\\d)\\] (\\d+\\.\\d+\\.\\d+\\.\\d+) (\\w+) (LOGIN_OK|LOGIN_FALHOU)\", usado com fullmatch na linha sem espaços nas pontas. Os 6 grupos viram hora (h*3600 + m*60 + s), ip, usuário e sucesso (evento == \"LOGIN_OK\"). Para suspeitos, um Counter dos IPs das falhas e uma compreensão de conjunto com n >= limite.", "extras": ""}, {"id": "n14", "distrito": 4, "titulo": "Calculadora de chaves", "intro": "<p>As fechaduras do Distrito Neon pedem o resultado de uma expressão como <code>(2 + 3) * 4<\/code>. Usar <code>eval<\/code> é proibido (e perigoso: executaria qualquer código). Vamos escrever um <b>analisador descendente recursivo<\/b>, uma função por nível de precedência:<\/p>\n<pre>expressao := termo ((\"+\" | \"-\") termo)*\ntermo     := fator ((\"*\" | \"/\") fator)*\nfator     := NUMERO | \"(\" expressao \")\" | \"-\" fator<\/pre>\n<p><code>expressao<\/code> chama <code>termo<\/code>, que chama <code>fator<\/code>, que pode voltar a chamar <code>expressao<\/code> dentro dos parênteses. Por isso a multiplicação \"gruda\" antes da soma. O <code>/<\/code> aqui é divisão inteira (<code>//<\/code>), e os operadores do mesmo nível são resolvidos da esquerda para a direita.<\/p>\n<pre>re.findall(r\"\\d+|\\S\", \"12*(3+4)\")   # ['12', '*', '(', '3', '+', '4', ')']<\/pre>", "task": "Crie <code>ErroSintaxe(Exception)<\/code> e <code>calcular(expr)<\/code>, que devolve o valor inteiro da expressão. Expressões inválidas (símbolo estranho, parêntese sobrando ou faltando, operador sem número, texto vazio, números colados como <code>\"1 2\"<\/code>) lançam <code>ErroSintaxe<\/code>. Sem <code>eval<\/code>.", "forbid": [["\\beval\\b|\\bexec\\b|\\bcompile\\b", "Nada de eval, exec ou compile: escreva o analisador."]], "starter": "import re\n\n\nclass ErroSintaxe(Exception):\n    pass\n\n\ndef calcular(expr):\n    tokens = re.findall(r\"\\d+|\\S\", expr)\n    pos = 0\n\n    def ver():\n        return tokens[pos] if pos < len(tokens) else None\n\n    def expressao():\n        pass\n\n    return expressao()\n", "solution": "import re\n\n\nclass ErroSintaxe(Exception):\n    pass\n\n\ndef calcular(expr):\n    tokens = re.findall(r\"\\d+|\\S\", expr)\n    pos = 0\n\n    def ver():\n        return tokens[pos] if pos < len(tokens) else None\n\n    def comer():\n        nonlocal pos\n        pos += 1\n        return tokens[pos - 1]\n\n    def expressao():\n        valor = termo()\n        while ver() in (\"+\", \"-\"):\n            valor = valor + termo() if comer() == \"+\" else valor - termo()\n        return valor\n\n    def termo():\n        valor = fator()\n        while ver() in (\"*\", \"/\"):\n            valor = valor * fator() if comer() == \"*\" else valor // fator()\n        return valor\n\n    def fator():\n        tok = ver()\n        if tok is None:\n            raise ErroSintaxe(\"a expressão terminou cedo\")\n        comer()\n        if tok.isdigit():\n            return int(tok)\n        if tok == \"-\":\n            return -fator()\n        if tok == \"(\":\n            valor = expressao()\n            if ver() != \")\":\n                raise ErroSintaxe(\"falta fechar parêntese\")\n            comer()\n            return valor\n        raise ErroSintaxe(f\"símbolo inesperado: {tok}\")\n\n    valor = expressao()\n    if ver() is not None:\n        raise ErroSintaxe(f\"sobrou: {ver()}\")\n    return valor\n", "hint": "Guarde a posição atual numa variável da função de fora e avance com nonlocal pos. fator: se for número, devolva int; se for \"-\", devolva -fator(); se for \"(\", calcule expressao() e exija \")\". termo e expressao: comecem com o nível de baixo e, enquanto o próximo token for um operador delas, consumam e combinem. No fim, se ainda sobrar token, é erro.", "extras": ""}, {"id": "n15", "distrito": 4, "titulo": "Linguagem da VESPA", "intro": "<p>Programar a VESPA movimento por movimento é lento. A equipe criou uma linguagem compacta com <b>repetição aninhada<\/b>:<\/p>\n<pre>L               um movimento (N, S, L ou O)\n3L              repete o item seguinte 3 vezes\n2[L S]          colchetes agrupam itens\n2[3L 2[S]] N    →  L L L S S L L L S S N<\/pre>\n<p>Gramática (espaços são ignorados):<\/p>\n<pre>programa := item*\nitem     := DIRECAO | NUMERO item | \"[\" item* \"]\"<\/pre>\n<p>A gramática é recursiva, então o compilador também é: <code>item()<\/code> chama a si mesmo para o que vem depois de um número e para o que está entre colchetes.<\/p>", "task": "Crie <code>ErroSintaxe(Exception)<\/code> e <code>compilar(programa)<\/code>, que devolve a lista de movimentos. Programas quebrados (colchete sem par, número sem item depois, símbolo desconhecido) lançam <code>ErroSintaxe<\/code>. A VESPA vai voar o seu resultado.", "starter": "import re\n\n\nclass ErroSintaxe(Exception):\n    pass\n\n\ndef compilar(programa):\n    tokens = re.findall(r\"\\d+|\\S\", programa)\n    pos = 0\n\n    def item():\n        pass\n\n    movimentos = []\n    return movimentos\n", "solution": "import re\n\n\nclass ErroSintaxe(Exception):\n    pass\n\n\ndef compilar(programa):\n    tokens = re.findall(r\"\\d+|\\S\", programa)\n    pos = 0\n\n    def item():\n        nonlocal pos\n        if pos >= len(tokens):\n            raise ErroSintaxe(\"o programa terminou no meio de um item\")\n        tok = tokens[pos]\n        pos += 1\n        if tok in (\"N\", \"S\", \"L\", \"O\"):\n            return [tok]\n        if tok.isdigit():\n            return int(tok) * item()\n        if tok == \"[\":\n            corpo = []\n            while pos < len(tokens) and tokens[pos] != \"]\":\n                corpo += item()\n            if pos >= len(tokens):\n                raise ErroSintaxe(\"falta fechar ]\")\n            pos += 1\n            return corpo\n        raise ErroSintaxe(f\"símbolo inesperado: {tok}\")\n\n    movimentos = []\n    while pos < len(tokens):\n        movimentos += item()\n    return movimentos\n", "hint": "item() lê um token e decide: direção → [tok]; número → int(tok) * item() (lista vezes número repete); \"[\" → acumule item() até achar \"]\" (se os tokens acabarem antes, erro) e pule o \"]\". Qualquer outro token, incluindo um \"]\" solto, é erro. O programa inteiro é: enquanto houver tokens, some item().", "extras": ""}, {"id": "n16", "distrito": 5, "titulo": "Trânsito do núcleo", "intro": "<p>As avenidas do núcleo estão congestionadas. Cada número no mapa é o <b>custo<\/b> de entrar naquela rua (o destino <code>@<\/code> custa 1). O caminho com menos casas pode ser o mais caro.<\/p>\n<p>A busca em largura não serve com custos diferentes. O certo é o <b>algoritmo de Dijkstra<\/b>: sempre expandir a posição de menor custo acumulado até agora, com uma <b>fila de prioridade<\/b>.<\/p>\n<pre>import heapq\nfila = [(0, inicio, [])]                 # (custo, posição, rota)\ncusto, pos, rota = heapq.heappop(fila)   # sempre o menor custo\nheapq.heappush(fila, (novo, vizinho, rota + [d]))<\/pre>\n<p>Guarde o melhor custo conhecido de cada posição e ignore entradas velhas da fila (com custo maior que o melhor já registrado).<\/p>", "task": "Escreva <code>rota_barata(mapa, inicio, fim)<\/code> (posições <code>(linha, coluna)<\/code>) que devolve a lista de movimentos de <b>menor custo total<\/b>. O mapa tem borda de prédios.", "starter": "import heapq\n\nPASSO = {\"N\": (-1, 0), \"S\": (1, 0), \"L\": (0, 1), \"O\": (0, -1)}\n\n\ndef custo(casa):\n    return int(casa) if casa.isdigit() else 1\n\n\ndef rota_barata(mapa, inicio, fim):\n    return []\n", "solution": "import heapq\n\nPASSO = {\"N\": (-1, 0), \"S\": (1, 0), \"L\": (0, 1), \"O\": (0, -1)}\n\n\ndef custo(casa):\n    return int(casa) if casa.isdigit() else 1\n\n\ndef rota_barata(mapa, inicio, fim):\n    fila = [(0, inicio, [])]\n    melhor = {inicio: 0}\n    while fila:\n        gasto, pos, rota = heapq.heappop(fila)\n        if pos == fim:\n            return rota\n        if gasto > melhor[pos]:\n            continue\n        for d, (dl, dc) in PASSO.items():\n            l, c = pos[0] + dl, pos[1] + dc\n            if mapa[l][c] == \"#\":\n                continue\n            novo = gasto + custo(mapa[l][c])\n            if novo < melhor.get((l, c), float(\"inf\")):\n                melhor[(l, c)] = novo\n                heapq.heappush(fila, (novo, (l, c), rota + [d]))\n    return []\n", "hint": "Comece com fila = [(0, inicio, [])] e melhor = {inicio: 0}. Tire sempre o menor com heappop. Se for o fim, devolva a rota. Se o custo tirado for maior que melhor[pos], é uma entrada velha: pule. Para cada vizinho que não é prédio, novo = gasto + custo(casa); se for menor que o melhor conhecido, atualize e faça heappush.", "extras": ""}, {"id": "n17", "distrito": 5, "titulo": "Coleta de chips", "intro": "<p>Chips de dados roubados estão espalhados pelos túneis. A VESPA precisa recolher <b>todos<\/b> e chegar ao ponto de extração <code>@<\/code> com o mínimo de movimentos. É o problema do caixeiro-viajante, e testar todas as ordens possíveis (9 chips dão 362.880 ordens) é lento demais.<\/p>\n<p>Programação dinâmica resolve: o melhor caminho a partir de \"estou no ponto <i>a<\/i> e faltam os chips do conjunto <i>F<\/i>\" depende só de <i>a<\/i> e <i>F<\/i>. Com <code>functools.lru_cache<\/code>, cada combinação é calculada uma vez só.<\/p>\n<pre>@lru_cache(maxsize=None)\ndef melhor(atual, faltam):          # faltam: frozenset (precisa ser hashable)\n    if not faltam:\n        return caminho até o @\n    return min(caminho(atual → i) + melhor(i, faltam - {i}) for i in faltam)<\/pre>\n<p>Antes disso, use busca em largura para achar o caminho mais curto entre cada par de pontos.<\/p>", "task": "Escreva <code>rota_coleta(mapa, inicio)<\/code>, que devolve a lista de movimentos <b>mais curta<\/b> que recolhe todos os chips <code>$<\/code> e termina no <code>@<\/code>.", "starter": "from collections import deque\nfrom functools import lru_cache\n\nPASSO = {\"N\": (-1, 0), \"S\": (1, 0), \"L\": (0, 1), \"O\": (0, -1)}\n\n\ndef caminhos(mapa, origem):\n    \"\"\"Devolve {posição: lista de movimentos mais curta desde origem}.\"\"\"\n    rotas = {origem: []}\n    return rotas\n\n\ndef rota_coleta(mapa, inicio):\n    return []\n", "solution": "from collections import deque\nfrom functools import lru_cache\n\nPASSO = {\"N\": (-1, 0), \"S\": (1, 0), \"L\": (0, 1), \"O\": (0, -1)}\n\n\ndef caminhos(mapa, origem):\n    rotas = {origem: []}\n    fila = deque([origem])\n    while fila:\n        l, c = fila.popleft()\n        for d, (dl, dc) in PASSO.items():\n            p = (l + dl, c + dc)\n            if mapa[p[0]][p[1]] != \"#\" and p not in rotas:\n                rotas[p] = rotas[(l, c)] + [d]\n                fila.append(p)\n    return rotas\n\n\ndef rota_coleta(mapa, inicio):\n    chips = [(l, c) for l, linha in enumerate(mapa) for c, casa in enumerate(linha) if casa == \"$\"]\n    fim = next((l, c) for l, linha in enumerate(mapa) for c, casa in enumerate(linha) if casa == \"@\")\n    pontos = [inicio] + chips\n    rotas = [caminhos(mapa, p) for p in pontos]\n\n    @lru_cache(maxsize=None)\n    def melhor(atual, faltam):\n        if not faltam:\n            return rotas[atual][fim]\n        return min((rotas[atual][pontos[i]] + melhor(i, faltam - {i}) for i in faltam), key=len)\n\n    return melhor(0, frozenset(range(1, len(pontos))))\n", "hint": "1) caminhos: BFS a partir de origem guardando a rota até cada casa. 2) Faça uma BFS a partir do início e de cada chip. 3) melhor(atual, faltam) com @lru_cache: sem chips faltando, devolva a rota até o @; senão, o min (key=len) entre ir até cada chip i e continuar com melhor(i, faltam - {i}). Use índices e frozenset para os argumentos serem hashable.", "extras": ""}, {"id": "n18", "distrito": 5, "titulo": "Lasers do núcleo", "intro": "<p>O coração da rede é protegido por lasers que pulsam. Um laser marcado <code>k<\/code> (0, 1 ou 2) fica ligado nos instantes <code>t<\/code> em que <code>t % 3 == k<\/code>. A VESPA começa no instante 0, cada ação leva 1 instante, e ela não pode <b>estar<\/b> numa casa de laser no instante em que ele liga.<\/p>\n<p>Às vezes o melhor é esperar: a ação <code>\"P\"<\/code> deixa a VESPA parada por um instante.<\/p>\n<p>O truque é perceber que a posição sozinha não descreve a situação: a mesma casa no instante 4 e no instante 5 são situações diferentes. Mas como os lasers repetem a cada 3 instantes, basta guardar <code>(posição, t % 3)<\/code> como estado da busca em largura.<\/p>\n<pre>estado = ((l, c), t % 3)\nacoes = {\"N\": (-1, 0), \"S\": (1, 0), \"L\": (0, 1), \"O\": (0, -1), \"P\": (0, 0)}<\/pre>", "task": "Escreva <code>rota_laser(mapa, inicio)<\/code>, que devolve a lista de ações (movimentos e <code>\"P\"<\/code>) que leva a VESPA ao <code>@<\/code> no <b>menor número de instantes<\/b> sem ser atingida.", "starter": "from collections import deque\n\nACOES = {\"N\": (-1, 0), \"S\": (1, 0), \"L\": (0, 1), \"O\": (0, -1), \"P\": (0, 0)}\n\n\ndef seguro(mapa, l, c, t):\n    casa = mapa[l][c]\n    if casa == \"#\":\n        return False\n    return not (casa in \"012\" and t % 3 == int(casa))\n\n\ndef rota_laser(mapa, inicio):\n    return []\n", "solution": "from collections import deque\n\nACOES = {\"N\": (-1, 0), \"S\": (1, 0), \"L\": (0, 1), \"O\": (0, -1), \"P\": (0, 0)}\n\n\ndef seguro(mapa, l, c, t):\n    casa = mapa[l][c]\n    if casa == \"#\":\n        return False\n    return not (casa in \"012\" and t % 3 == int(casa))\n\n\ndef rota_laser(mapa, inicio):\n    fila = deque([(inicio, 0, [])])\n    vistos = {(inicio, 0)}\n    while fila:\n        (l, c), t, rota = fila.popleft()\n        if mapa[l][c] == \"@\":\n            return rota\n        for acao, (dl, dc) in ACOES.items():\n            nl, nc = l + dl, c + dc\n            estado = ((nl, nc), (t + 1) % 3)\n            if seguro(mapa, nl, nc, t + 1) and estado not in vistos:\n                vistos.add(estado)\n                fila.append(((nl, nc), t + 1, rota + [acao]))\n    return []\n", "hint": "É uma BFS normal com duas mudanças: a fila guarda (posição, t, rota) e vistos guarda (posição, t % 3); e \"P\" entra como uma ação a mais, com deslocamento (0, 0). Para cada ação, a casa de destino precisa ser segura no instante t + 1.", "extras": ""}], "casos": {"n1": [{"mostra": ["tentar, bloqueadas = criar_limitador(3, 5)", "tentativas: a@0 a@1 a@1 a@2 a@4 a@5 a@6 a@7 a@9 a@12"]}, {"mostra": ["tentar, bloqueadas = criar_limitador(2, 3)   # e um segundo limitador b", "tentativas: a@0 b@0 a@1 b@1 a@2 b@2 a@3 b@3 a@4 a@4 b@6 a@9"]}, {"mostra": ["tentar, bloqueadas = criar_limitador(1, 1)", "tentativas: a@5 a@5 a@6 a@6 a@6 a@10"]}], "n2": [{"mostra": ["@registrar", "def invadir(alvo, nivel=1): ...", "invadir(\"srv-07\", nivel=3)", "invadir(\"cam-12\")"]}, {"mostra": ["@registrar", "def decifrar(chave): ...   # falha com ValueError", "decifrar(\"0xFF\")", "decifrar(\"zz\")"]}], "n3": [{"mostra": ["@tentativas(3, ConexaoInstavel)", "def abrir_porta(codigo): ...", "# a porta falha 2 vez(es) com ConexaoInstavel"]}, {"mostra": ["@tentativas(3, ConexaoInstavel)", "def abrir_porta(codigo): ...", "# a porta falha 5 vez(es) com ConexaoInstavel"]}, {"mostra": ["@tentativas(4, ConexaoInstavel)", "def abrir_porta(codigo): ...", "# a porta falha 1 vez(es) com Firewall"]}, {"mostra": ["@tentativas(5, ConexaoInstavel, TimeoutError)", "def abrir_porta(codigo): ...", "# a porta falha 3 vez(es) com ConexaoInstavel e TimeoutError alternados"]}], "n4": [{"mapa": ["################", "#S#######...$.##", "#.#######.###.##", "#.#####...###.##", "#.#####.#####.##", "#...$...#####..#", "##############@#", "################"], "nota": "Plano de voo: 4×S 6×L 2×N 2×L 2×N 4×L 4×S 1×L 1×S"}, {"mapa": ["##############", "#S...####....#", "####.####.##.#", "####$####$##.#", "####.####.##$#", "####......##.#", "############.#", "##########@..#", "##############"], "nota": "Plano de voo: 3×L 4×S 5×L 4×N 3×L 6×S 2×O"}], "n5": [{"mapa": ["S..#....", ".#.#.##.", ".#...#..", ".####.#.", "......#@"], "nota": "Mapa sem borda: fora dos limites conta como prédio."}, {"mapa": ["S.#.......", ".##.####.#", "...#...#..", "##...#.#.#", "....##...@"], "nota": "Mapa sem borda: fora dos limites conta como prédio."}], "n6": [{"mostra": ["with camuflagem(vespa) as d:", "    d.coletar()          # nada acontece"]}, {"mostra": ["with camuflagem(vespa):", "    raise Detectado(\"câmera 4\")   # deve ser abafada"]}, {"mostra": ["with camuflagem(vespa):", "    raise ValueError(\"bateria\")   # deve subir"]}, {"mostra": ["with camuflagem(a):", "    with camuflagem(b):", "        raise Detectado(\"sensor\")"]}], "n7": [{"mapa": ["########", "#S.$...#", "#......#", "#...$.$#", "#@...$.#", "########"], "nota": "Varredura(4, 6)"}, {"mapa": ["###", "#S#", "#$#", "#@#", "###"], "nota": "Varredura(3, 1)"}, {"mapa": ["#######", "#S..$@#", "#######"], "nota": "Varredura(1, 5)"}, {"mapa": ["######", "#S.$.#", "#..$.#", "#..$.#", "#....#", "#...@#", "######"], "nota": "Varredura(5, 4)"}], "n8": [{"mostra": ["# log da rede — distrito 7", "02:14 SRV-1 INFO backup concluído", "02:15 SRV-2 ERRO porta 22 recusou conexão", "", "02:15 SRV-1 ERRO certificado expirado", "…"]}, {"mostra": ["alertas(linhas, \"SRV-2\")"]}, {"mostra": ["fluxo = itertools.cycle(linhas)   # nunca termina", "list(itertools.islice(alertas(fluxo), 7))"]}], "n9": [{"mostra": ["m = monitor(50, 3)", "next(m)", "leituras: 40, 45, 70, 80, 20, 10, 90, 55"]}, {"mostra": ["m = monitor(100, 1)", "next(m)", "leituras: 100, 101, 99, 150"]}, {"mostra": ["m = monitor(30, 4)", "next(m)", "leituras: 10, 10, 10, 100, 0, 0, 0, "calcular('2 +')  # ErroSintaxe", "calcular('(1 + 2')  # ErroSintaxe", "calcular('3 $ 4')  # ErroSintaxe", "calcular('')  # ErroSintaxe"]}, {"mostra": ["calcular('2*(3+(4-1))*5')", "calcular('7 - -2')", "calcular('12 / (1 + 2) - 8 * -1')", "calcular('  42  ')", "calcular('1 + 2 * 3 - 4 / 2 + (5)')", "calcular('1 2')  # ErroSintaxe", "calcular('()')  # ErroSintaxe", "calcular('4 * (2))')  # ErroSintaxe", "calcular('* 3')  # ErroSintaxe"]}], "n15": [{"mapa": ["########", "#S...###", "####$.@#", "#####..#", "########"], "nota": "Programa: 3L 2[S L] N"}, {"mapa": ["#########", "#S...####", "####.####", "####..$.#", "#######.#", "###..$..#", "###.#####", "###.#####", "###@#####", "#########"], "nota": "Programa: 2[3L 2S] 4[O] 3S"}, {"mapa": ["##############", "#S..##########", "###...########", "####...#######", "######.#######", "######.#######", "######.#######", "######.#######", "######$#######", "######.#######", "######.#######", "######.#######", "######.#######", "######......@#", "##############"], "nota": "Programa: L 2[2[L S] N] 10S 3[2L]"}], "n16": [{"mapa": ["#################", "#S9#21#21155#18##", "#1212222531313#2#", "#3811315112#8321#", "#311919#2###8##9#", "#9999#1911999911#", "#8321#981#93#313#", "#222312293351839#", "#2815#9592181112#", "##119#5123#2191@#", "#################"], "custos": true, "nota": "Número na rua = custo de entrar nela (trânsito)."}, {"mapa": ["#################", "#S8291#11519##13#", "#221291391121115#", "#22251#1#12215#2#", "##2151##135##2#8#", "##19921959192599#", "#1#12181#1##3911#", "#31#8#1131385115#", "#11##5589#112181#", "#12382252531121@#", "#################"], "custos": true, "nota": "Número na rua = custo de entrar nela (trânsito)."}, {"mapa": ["#################", "#S1#51221#895111#", "#33238#81191#223#", "##982#189#111#1##", "#1183#81982#192##", "##955#999199#599#", "##82#151#5589121#", "#1815323##821211#", "#18##18#21193111#", "#11122111123259@#", "#################"], "custos": true, "nota": "Número na rua = custo
